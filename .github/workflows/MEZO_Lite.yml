name: "✨ DeadZone Lite"

run-name: "✨ DeadZone Lite • ${{ inputs.request_id || github.actor }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Bot request ID. Leave empty for a manual GitHub build."
        required: false
        type: string
      rom_link:
        description: "HTTPS ROM link for a manual GitHub build."
        required: false
        type: string
      builder_label:
        description: "Optional builder label for a manual GitHub build."
        required: false
        type: string
      language:
        description: "Live build language."
        required: false
        default: "en"
        type: choice
        options: ["en", "ar"]
  workflow_call:
    inputs:
      request_id:
        required: true
        type: string
      rom_link:
        required: false
        type: string
      builder_label:
        required: false
        type: string
      language:
        required: false
        default: "en"
        type: string

permissions:
  contents: read

jobs:
  machine:
    uses: ./.github/workflows/machine-rom.yml
    with:
      project: lite
      project_code: LT
      edition_repository: mohammedmezo99/DeadZone_Lite
      edition_ref: main
      request_id: ${{ inputs.request_id }}
      rom_link: ${{ inputs.rom_link }}
      builder_label: ${{ inputs.builder_label }}
      language: ${{ inputs.language }}
    secrets: inherit
