name: "✨ DeadZone Lite"

run-name: "✨ DeadZone Lite • ${{ inputs.request_id || github.actor }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Bot request ID. Leave empty for manual GitHub build."
        required: false
        type: string
      rom_link:
        description: "Direct ROM link for manual GitHub build."
        required: false
        type: string
      builder_label:
        description: "Optional builder label for manual GitHub build."
        required: false
        type: string
      language:
        description: "Live build language for manual GitHub build."
        required: false
        default: "en"
        type: choice
        options: ["en", "ar"]
      publish_release:
        description: "Publish release message after manual build?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  workflow_call:
    inputs:
      request_id:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deadzone-lite-build-queue
  queue: max
  cancel-in-progress: false

jobs:
  build:
    name: "✨ Build DeadZone Lite"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CONTROL_BOT_CONTRACT_URL: https://deadzone-mezo-v3-20260726.fly.dev/contract/resolve
      CONTROL_BOT_TELEMETRY_URL: https://deadzone-mezo-v3-20260726.fly.dev/telemetry

    steps:
      - name: "⚡ Maximize Lite build space"
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-docker-images: "true"

      - name: "📥 Checkout DeadZone launcher"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "🔐 Load DeadZone secrets"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mohammedmezo99/DeadZone-Secrets
          token: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: main
          path: .deadzone-secrets
          fetch-depth: 1
          persist-credentials: false

      - name: "🔑 Import Lite runtime"
        id: central
        shell: bash
        env:
          DEADZONE_PRIVATE_TOKEN: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: bash .deadzone-secrets/load-build.sh lite

      - name: "🔐 Resolve Lite build mode"
        id: mode
        shell: bash
        env:
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
          INPUT_ROM_LINK: ${{ inputs.rom_link }}
          INPUT_BUILDER_LABEL: ${{ inputs.builder_label }}
          INPUT_LANGUAGE: ${{ inputs.language }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${INPUT_REQUEST_ID:-}" ]]; then
            [[ "$INPUT_REQUEST_ID" =~ ^DZ-LT-[0-9]{8}-[0-9]{4}$ ]] || { echo "Invalid DeadZone Lite request ID" >&2; exit 1; }
            [[ -n "${BUILD_PROGRESS_SECRET:-}" ]] || { echo "Missing BUILD_PROGRESS_SECRET" >&2; exit 1; }
            export REQUEST_ID="$INPUT_REQUEST_ID"
            python3 - <<'PY'
          import base64, hashlib, hmac, json, os, re, urllib.request
          from datetime import datetime, timezone

          secret = os.environ["BUILD_PROGRESS_SECRET"]
          request_id = os.environ["REQUEST_ID"]
          payload = {"schema_version":"1.0","request_id":request_id,"project":"lite","timestamp":datetime.now(timezone.utc).isoformat()}
          body = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          signature = hmac.new(secret.encode(), body, hashlib.sha256).hexdigest()
          req = urllib.request.Request(os.environ["CONTROL_BOT_CONTRACT_URL"], data=body, method="POST", headers={"Content-Type":"application/json","X-DeadZone-Signature":signature})
          with urllib.request.urlopen(req, timeout=20) as response:
              response_body = response.read()
              response_signature = response.headers.get("X-DeadZone-Signature", "")
          expected = hmac.new(secret.encode(), response_body, hashlib.sha256).hexdigest()
          if not hmac.compare_digest(expected, response_signature): raise SystemExit("Invalid control response signature")
          contract = json.loads(response_body)
          if contract.get("request_id") != request_id or contract.get("project") != "lite": raise SystemExit("Private contract mismatch")

          source_url = str((contract.get("source") or {}).get("url") or "")
          builder = contract.get("builder") or {}
          live = contract.get("live_message") or {}
          builder_id = int(builder.get("telegram_user_id") or 0)
          builder_slug = str(builder.get("slug") or "")
          builder_name = str(builder.get("display_name") or builder.get("username") or builder_slug or "DeadZone Builder")
          language = "ar" if str(contract.get("language") or "").lower() == "ar" else "en"
          status_chat_id = int(live.get("chat_id") or 0)
          status_message_id = int(live.get("message_id") or 0)

          if not source_url.startswith("https://"): raise SystemExit("Lite source URL is missing or invalid")
          if builder_id <= 0 or not re.fullmatch(r"[a-z0-9_.-]{1,48}", builder_slug): raise SystemExit("Builder identity is invalid")
          if status_chat_id == 0 or status_message_id <= 0: raise SystemExit("Lite live-message contract is missing")

          print(f"::add-mask::{source_url}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"REQUEST_ID={request_id}\n")
              out.write("ROM_URL_B64=" + base64.b64encode(source_url.encode()).decode() + "\n")
              out.write(f"BUILDER_ID={builder_id}\nBUILDER_SLUG={builder_slug}\n")
              out.write("BUILDER_NAME_B64=" + base64.b64encode(builder_name.encode()).decode() + "\n")
              out.write(f"DEADZONE_LANGUAGE={language}\n")
              out.write(f"TELEGRAM_MSG_CHAT_ID={status_chat_id}\n")
              out.write(f"TELEGRAM_MSG_ID={status_message_id}\n")
              out.write("REQUEST_SOURCE=telegram\nDEADZONE_CONTROLLED_BUILD=1\n")
          PY
            echo "mode=bot" >> "$GITHUB_OUTPUT"
          else
            [[ "${INPUT_ROM_LINK:-}" == https://* ]] || { echo "Manual GitHub build requires an HTTPS rom_link" >&2; exit 1; }
            echo "::add-mask::$INPUT_ROM_LINK"
            builder="${INPUT_BUILDER_LABEL:-${GITHUB_ACTOR}}"
            language="${INPUT_LANGUAGE:-en}"
            [[ "$language" == "ar" ]] || language="en"
            echo "ROM_URL_B64=$(printf '%s' "$INPUT_ROM_LINK" | base64 -w0)" >> "$GITHUB_ENV"
            echo "BUILDER_NAME_B64=$(printf '%s' "$builder" | base64 -w0)" >> "$GITHUB_ENV"
            {
              echo "REQUEST_ID=DZ-LT-DIRECT-${GITHUB_RUN_ID}"
              echo "BUILDER_ID=0"
              echo "BUILDER_SLUG=github"
              echo "REQUEST_SOURCE=github"
              echo "DEADZONE_CONTROLLED_BUILD=0"
              echo "DEADZONE_LANGUAGE=$language"
            } >> "$GITHUB_ENV"
            echo "mode=manual" >> "$GITHUB_OUTPUT"
          fi
          echo "BUILD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: "📡 Prepare DeadZone Lite"
        if: steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" preparing in_progress 0 "Preparing DeadZone Lite." || true

      - name: "🛡️ Validate Lite runtime"
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${LITE_ENGINE_REPOSITORY:-}" ]] || { echo "Missing LITE_ENGINE_REPOSITORY" >&2; exit 1; }
          [[ -n "${PRIVATE_REPO_TOKEN:-}" ]] || { echo "Missing private repository token" >&2; exit 1; }
          for key in RCLONE_CONFIG_BASE64 RCLONE_REMOTE_NAME RCLONE_UPLOAD_DIR; do
            [[ -n "${!key:-}" ]] || { echo "Missing $key" >&2; exit 1; }
          done

      - name: "✨ Load Lite engine"
        if: steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" loading_engine in_progress 1 "Loading DeadZone Lite." || true

      - name: "📥 Checkout private Lite engine"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ steps.central.outputs.engine_repository }}
          token: ${{ env.PRIVATE_REPO_TOKEN }}
          path: engine
          ref: main
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: "🧰 Prepare Lite tools"
        if: steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" installing_tools in_progress 2 "Preparing Lite tools." || true

      - name: "⚙️ Prepare Lite environment"
        working-directory: engine
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo timedatectl set-timezone Africa/Cairo
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            software-properties-common ca-certificates curl gnupg file git aria2 jq sshpass ffmpeg \
            python-is-python3 wget python3 python3-pip lz4 xz-utils brotli device-tree-compiler \
            zlib1g-dev gcc g++ libc6 libstdc++6 dialog libgtk-3-dev busybox zip unzip p7zip-full \
            zstd bc android-sdk-libsparse-utils golang-go rclone
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends erofs-utils xmlstarlet zipalign aapt || true
          sudo env GOBIN=/usr/local/bin go install github.com/ssut/payload-dumper-go/cmd/payload-dumper-go@latest || true
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user ConfigObj requests telebot setuptools gdown
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          find . -type f -name '*.sh' -exec chmod +x {} +
          chmod +x build.sh packROM.sh uploadROM.sh
          chmod +x bin/Linux/x86_64/* 2>/dev/null || true
          chmod +x bin/tool/Linux/x86_64/* 2>/dev/null || true
          bash -n build.sh && bash -n packROM.sh && bash -n uploadROM.sh

      - name: "🛠️ Build, package and upload DeadZone Lite"
        working-directory: engine
        shell: bash
        run: |
          set -Eeuo pipefail
          rom="$(printf '%s' "$ROM_URL_B64" | base64 --decode)"
          export BUILDER_NAME="$(printf '%s' "$BUILDER_NAME_B64" | base64 --decode)"
          export INPUT_URL="$rom"

          if [[ "${DEADZONE_CONTROLLED_BUILD:-0}" == "1" ]]; then
            bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" building in_progress 3 "Building DeadZone Lite." || true
          fi
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" bash build.sh "$rom" 2>&1 | tee build_action.log

          if [[ "${DEADZONE_CONTROLLED_BUILD:-0}" == "1" ]]; then
            bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" packaging in_progress 4 "Packaging DeadZone Lite." || true
          else
            python3 notify.py pack DeadZone_Lite "$rom" mezo-lite "$BUILDER_NAME" "" || true
          fi
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" bash packROM.sh 2>&1 | tee pack_action.log

          if [[ "${DEADZONE_CONTROLLED_BUILD:-0}" == "1" ]]; then
            bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" preparing_upload in_progress 5 "Preparing Lite delivery." || true
          fi
          base_dir="${RCLONE_UPLOAD_DIR%/}"
          if [[ "${DEADZONE_CONTROLLED_BUILD:-0}" == "1" ]]; then
            export RCLONE_UPLOAD_DIR="${base_dir}/lite/${BUILDER_SLUG}_${BUILDER_ID}/${REQUEST_ID}"
          else
            export RCLONE_UPLOAD_DIR="${base_dir}/lite/direct/${GITHUB_ACTOR}/${GITHUB_RUN_ID}"
          fi
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" bash uploadROM.sh setup

          if [[ "${DEADZONE_CONTROLLED_BUILD:-0}" == "1" ]]; then
            bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" uploading in_progress 6 "Uploading DeadZone Lite." || true
          else
            python3 notify.py upload DeadZone_Lite "$rom" mezo-lite "$BUILDER_NAME" "" || true
          fi
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" bash uploadROM.sh 2>&1 | tee upload_action.log

          if [[ "${DEADZONE_CONTROLLED_BUILD:-0}" == "1" ]]; then
            bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" finalizing in_progress 7 "Final verification." || true
          fi

      - name: "✅ Create Lite result contract"
        working-directory: engine
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit

          def first(paths):
              for path in paths:
                  p = Path(path)
                  if p.is_file():
                      value = p.read_text(encoding="utf-8", errors="replace").strip()
                      if value:
                          return value
              return ""

          name = first(["bin/runtime/info/output_zip.txt","bin/runtime/info/output_file.txt","bin/ddevice/output_zip.txt"])
          link = first(["bin/runtime/info/drive_link.txt","bin/runtime/info/upload_link.txt","bin/ddevice/drive_link.txt"])
          output_path = first(["bin/runtime/info/output_path.txt"])
          artifact = Path(output_path) if output_path else Path("out") / name
          if not name or not artifact.is_file() or artifact.stat().st_size <= 0:
              raise SystemExit("Lite output archive is missing")
          parsed = urlsplit(link)
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("Lite delivery link is invalid")
          result = {
              "schema_version":"1.0",
              "request_id":os.environ["REQUEST_ID"],
              "project":"lite",
              "status":"success",
              "provider":"google_drive",
              "url":link,
              "file_name":artifact.name,
              "size":artifact.stat().st_size,
              "completed_at":datetime.now(timezone.utc).isoformat(),
          }
          Path("../deadzone-result.json").write_text(json.dumps(result, sort_keys=True, indent=2), encoding="utf-8")
          PY

      - name: "✅ Lite completed"
        if: success() && steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" finalizing success 8 "DeadZone Lite completed." || true

      - name: "❌ Lite failed"
        if: failure() && steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" "${DZ_CURRENT_STAGE_KEY:-preparing}" failed "${DZ_COMPLETED_STAGES:-0}" "DeadZone Lite stopped safely." || true

      - name: "🚫 Lite cancelled"
        if: cancelled() && steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" "${DZ_CURRENT_STAGE_KEY:-preparing}" cancelled "${DZ_COMPLETED_STAGES:-0}" "DeadZone Lite was cancelled safely." || true

      - name: "✅ Manual Lite verified"
        if: success() && steps.mode.outputs.mode == 'manual'
        working-directory: engine
        continue-on-error: true
        run: python3 notify.py success DeadZone_Lite "" mezo-lite "${BUILDER_NAME:-${GITHUB_ACTOR}}" ""

      - name: "❌ Manual Lite failed"
        if: failure() && steps.mode.outputs.mode == 'manual'
        working-directory: engine
        continue-on-error: true
        run: python3 notify.py fail DeadZone_Lite "" mezo-lite "${BUILDER_NAME:-${GITHUB_ACTOR}}" ""

      - name: "🚀 Publish manual Lite release"
        if: success() && steps.mode.outputs.mode == 'manual' && inputs.publish_release == 'true'
        working-directory: engine
        continue-on-error: true
        run: python3 notify.py release success

      - name: "📤 Expose Lite result"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deadzone-result-${{ env.REQUEST_ID }}
          path: deadzone-result.json
          if-no-files-found: error
          retention-days: 1

      - name: "🧾 Upload Lite diagnostics"
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deadzone-lite-diagnostics-${{ env.REQUEST_ID }}
          path: |
            engine/build_action.log
            engine/pack_action.log
            engine/upload_action.log
            engine/bin/runtime/logs/
            engine/bin/runtime/reports/
          if-no-files-found: warn
          retention-days: 3

      - name: "🧹 Cleanup Lite credentials"
        if: always()
        shell: bash
        run: rm -f -- engine/rclone.conf engine/bin/runtime/config/rclone.conf
