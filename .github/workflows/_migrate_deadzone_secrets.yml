name: "DeadZone • Finalize workflow-only launcher"

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_migrate_deadzone_secrets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CENTRAL_TOKEN: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
      BUILD_PROGRESS_SECRET: ${{ secrets.BUILD_PROGRESS_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      MEZO_PRIVATE_CHAT_ID: ${{ secrets.MEZO_PRIVATE_CHAT_ID }}
      TELEGRAM_RELEASE_GROUP_ID: ${{ secrets.TELEGRAM_RELEASE_GROUP_ID }}
      MEZO_CONTACT_LINK: ${{ secrets.MEZO_CONTACT_LINK }}
      UPDATES_GROUP_LINK: ${{ secrets.UPDATES_GROUP_LINK }}
      SCREENSHOTS_GROUP_LINK: ${{ secrets.SCREENSHOTS_GROUP_LINK }}
      CHAT_GROUP_LINK: ${{ secrets.CHAT_GROUP_LINK }}
      CHANGELOG_LINK: ${{ secrets.CHANGELOG_LINK }}
      SCREENSHOTS_POST_LINK: ${{ secrets.SCREENSHOTS_POST_LINK }}
      RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
      RCLONE_REMOTE_NAME: ${{ secrets.RCLONE_REMOTE_NAME }}
      RCLONE_UPLOAD_DIR: ${{ secrets.RCLONE_UPLOAD_DIR }}
      RCLONE_PUBLIC_LINK_BASE: ${{ secrets.RCLONE_PUBLIC_LINK_BASE }}

    steps:
      - name: Checkout DeadZone-Build
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: launcher
          fetch-depth: 1
          persist-credentials: true

      - name: Try to migrate current values to DeadZone-Secrets
        if: env.CENTRAL_TOKEN != ''
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${CENTRAL_TOKEN}@github.com/mohammedmezo99/DeadZone-Secrets.git" central
          python3 - <<'PY'
          import base64
          import os
          import shlex
          import shutil
          from pathlib import Path

          central = Path("central")
          keys = [
              "BUILD_PROGRESS_SECRET", "TELEGRAM_BOT_TOKEN", "MEZO_PRIVATE_CHAT_ID",
              "TELEGRAM_RELEASE_GROUP_ID", "MEZO_CONTACT_LINK", "UPDATES_GROUP_LINK",
              "SCREENSHOTS_GROUP_LINK", "CHAT_GROUP_LINK", "CHANGELOG_LINK",
              "SCREENSHOTS_POST_LINK", "RCLONE_REMOTE_NAME", "RCLONE_UPLOAD_DIR",
              "RCLONE_PUBLIC_LINK_BASE",
          ]
          values = {key: os.environ.get(key, "") for key in keys}
          values["UPDATES_GROUP_LINK"] = values["UPDATES_GROUP_LINK"] or "https://t.me/xDeadZone"
          values["CHAT_GROUP_LINK"] = values["CHAT_GROUP_LINK"] or "https://t.me/DeadZoneDiscussion"

          if values.get("BUILD_PROGRESS_SECRET") and values.get("RCLONE_REMOTE_NAME") and values.get("RCLONE_UPLOAD_DIR"):
              lines = [
                  "# Central DeadZone build runtime values.",
                  "# Loaded by each public workflow at run time.",
                  "",
              ]
              lines.extend(f"{key}={shlex.quote(values[key])}" for key in keys)
              lines.append("")
              (central / "build.env").write_text("\n".join(lines), encoding="utf-8")

          encoded = os.environ.get("RCLONE_CONFIG_BASE64", "").strip()
          if encoded:
              raw = base64.b64decode(encoded, validate=True)
              if raw.strip():
                  (central / "rclone.conf").write_bytes(raw)

          source = Path("launcher/scripts")
          runtime = central / "runtime"
          runtime.mkdir(parents=True, exist_ok=True)
          if source.is_dir():
              for item in source.iterdir():
                  if item.is_file():
                      shutil.copy2(item, runtime / item.name)
          PY
          cd central
          git config user.name "DeadZone Automation"
          git config user.email "deadzone-automation@users.noreply.github.com"
          git add build.env rclone.conf runtime/ || true
          if ! git diff --cached --quiet; then
            git commit -m "secrets: migrate active build runtime"
            git push origin HEAD:main
          fi

      - name: Keep each edition workflow complete and load its runtime centrally
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("launcher")
          workflow_dir = root / ".github" / "workflows"
          projects = {
              "MEZO_Lite.yml": "lite",
              "gamingplus.yml": "gamingplus",
              "DeadZone_Port.yml": "port",
              "legend.yml": "legend",
              "ninja.yml": "ninja",
              "frameworkpatcher.yml": "frameworkpatcher",
          }

          def gh(expr: str) -> str:
              return "$" + "{{ " + expr + " }}"

          bootstrap = gh("secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN")
          engine = gh("steps.central.outputs.engine_repository")
          module = gh("steps.central.outputs.framework_module_repository")
          runtime_block = lambda project: (
              "\n"
              "      - name: Load DeadZone secrets\n"
              "        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683\n"
              "        with:\n"
              "          repository: mohammedmezo99/DeadZone-Secrets\n"
              f"          token: {bootstrap}\n"
              "          ref: main\n"
              "          path: .deadzone-secrets\n"
              "          fetch-depth: 1\n"
              "          persist-credentials: false\n"
              "\n"
              "      - name: Import project secrets\n"
              "        id: central\n"
              "        shell: bash\n"
              "        env:\n"
              f"          DEADZONE_PRIVATE_TOKEN: {bootstrap}\n"
              f"        run: bash .deadzone-secrets/load-build.sh {project}\n"
          )

          for filename, project in projects.items():
              path = workflow_dir / filename
              if not path.is_file():
                  raise SystemExit(f"Missing canonical workflow: {filename}")
              text = path.read_text(encoding="utf-8")

              # Private helpers are no longer stored in the public launcher.
              text = text.replace('bash "$GITHUB_WORKSPACE/scripts/emit_stage.sh"', 'bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh"')
              text = text.replace("bash scripts/emit_stage.sh", 'bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh"')
              text = text.replace("python3 scripts/send_telemetry.py", 'python3 "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/send_telemetry.py"')

              # Repository routing comes from DeadZone-Secrets.
              for old, new in {
                  gh("secrets.LITE_ENGINE_REPOSITORY"): engine,
                  gh("secrets.GAMINGPLUS_ENGINE_REPOSITORY"): engine,
                  gh("secrets.PORT_ENGINE_REPOSITORY"): engine,
                  gh("secrets.FRAMEWORK_ENGINE_REPOSITORY"): engine,
                  gh("secrets.FRAMEWORK_MODULE_REPOSITORY"): module,
              }.items():
                  text = text.replace(old, new)
              text = text.replace("repository: hypermezo4-create/DeadZone_GamingPlus", "repository: " + engine)
              text = text.replace("repository: hypermezo4-create/DeadZone_Legend", "repository: " + engine)
              text = text.replace("repository: hypermezo4-create/DeadZone_Ninja", "repository: " + engine)

              # Engine checkouts use the token imported by the central loader.
              text = text.replace(gh("secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN"), gh("env.PRIVATE_REPO_TOKEN"))
              text = text.replace(gh("secrets.PRIVATE_REPO_TOKEN"), gh("env.PRIVATE_REPO_TOKEN"))

              if ".deadzone-secrets/load-build.sh" not in text:
                  match = re.search(r"(?mi)^\s{6}- name: .*checkout.*launcher.*$", text)
                  if match is None:
                      raise SystemExit(f"Could not find launcher checkout in {filename}")
                  marker = text.find("persist-credentials: false", match.end())
                  if marker < 0:
                      raise SystemExit(f"Could not find launcher checkout end in {filename}")
                  end = text.find("\n", marker)
                  end = len(text) if end < 0 else end + 1
                  text = text[:end] + runtime_block(project) + text[end:]

              if "scripts/" in text:
                  raise SystemExit(f"Public scripts dependency remains in {filename}")
              path.write_text(text, encoding="utf-8")

          # Exactly the six real edition workflows remain.
          for path in workflow_dir.iterdir():
              if path.is_file() and path.name not in projects:
                  path.unlink()
          PY

      - name: Remove every public file outside the six workflows
        working-directory: launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/workflows/MEZO_Lite.yml|\
              .github/workflows/gamingplus.yml|\
              .github/workflows/DeadZone_Port.yml|\
              .github/workflows/legend.yml|\
              .github/workflows/ninja.yml|\
              .github/workflows/frameworkpatcher.yml) ;;
              *) git rm -f -- "$file" 2>/dev/null || true ;;
            esac
          done < <(git ls-files -z)
          git add -A

      - name: Commit final workflow-only launcher
        working-directory: launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "DeadZone Automation"
          git config user.email "deadzone-automation@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "build: keep edition workflows only with central runtime"
          git push origin HEAD:main
