name: "DeadZone • One-time central secrets setup"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CENTRAL_TOKEN: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
      BUILD_PROGRESS_SECRET: ${{ secrets.BUILD_PROGRESS_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      MEZO_PRIVATE_CHAT_ID: ${{ secrets.MEZO_PRIVATE_CHAT_ID }}
      TELEGRAM_RELEASE_GROUP_ID: ${{ secrets.TELEGRAM_RELEASE_GROUP_ID }}
      MEZO_CONTACT_LINK: ${{ secrets.MEZO_CONTACT_LINK }}
      UPDATES_GROUP_LINK: ${{ secrets.UPDATES_GROUP_LINK }}
      SCREENSHOTS_GROUP_LINK: ${{ secrets.SCREENSHOTS_GROUP_LINK }}
      CHAT_GROUP_LINK: ${{ secrets.CHAT_GROUP_LINK }}
      CHANGELOG_LINK: ${{ secrets.CHANGELOG_LINK }}
      SCREENSHOTS_POST_LINK: ${{ secrets.SCREENSHOTS_POST_LINK }}
      RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
      RCLONE_REMOTE_NAME: ${{ secrets.RCLONE_REMOTE_NAME }}
      RCLONE_UPLOAD_DIR: ${{ secrets.RCLONE_UPLOAD_DIR }}
      RCLONE_PUBLIC_LINK_BASE: ${{ secrets.RCLONE_PUBLIC_LINK_BASE }}

    steps:
      - name: Validate private repository credential
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${CENTRAL_TOKEN:-}" ]] || {
            echo "Missing one private-repository credential" >&2
            exit 1
          }

      - name: Checkout DeadZone-Build
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: launcher
          fetch-depth: 1
          persist-credentials: true

      - name: Checkout DeadZone-Secrets
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mohammedmezo99/DeadZone-Secrets
          token: ${{ env.CENTRAL_TOKEN }}
          ref: main
          path: central
          fetch-depth: 1
          persist-credentials: true

      - name: Move current runtime values to DeadZone-Secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import os
          import shlex
          import shutil
          from pathlib import Path

          central = Path("central")
          keys = [
              "BUILD_PROGRESS_SECRET",
              "TELEGRAM_BOT_TOKEN",
              "MEZO_PRIVATE_CHAT_ID",
              "TELEGRAM_RELEASE_GROUP_ID",
              "MEZO_CONTACT_LINK",
              "UPDATES_GROUP_LINK",
              "SCREENSHOTS_GROUP_LINK",
              "CHAT_GROUP_LINK",
              "CHANGELOG_LINK",
              "SCREENSHOTS_POST_LINK",
              "RCLONE_REMOTE_NAME",
              "RCLONE_UPLOAD_DIR",
              "RCLONE_PUBLIC_LINK_BASE",
          ]
          values = {key: os.environ.get(key, "") for key in keys}
          values["UPDATES_GROUP_LINK"] = values["UPDATES_GROUP_LINK"] or "https://t.me/xDeadZone"
          values["CHAT_GROUP_LINK"] = values["CHAT_GROUP_LINK"] or "https://t.me/DeadZoneDiscussion"

          required = ["BUILD_PROGRESS_SECRET", "RCLONE_REMOTE_NAME", "RCLONE_UPLOAD_DIR"]
          missing = [key for key in required if not values[key]]
          if missing:
              raise SystemExit("Missing existing build values: " + ", ".join(missing))

          lines = [
              "# Central DeadZone build runtime values.",
              "# Loaded by each public workflow at run time.",
              "",
          ]
          lines.extend(f"{key}={shlex.quote(values[key])}" for key in keys)
          lines.append("")
          (central / "build.env").write_text("\n".join(lines), encoding="utf-8")

          encoded = os.environ.get("RCLONE_CONFIG_BASE64", "").strip()
          if not encoded:
              raise SystemExit("RCLONE_CONFIG_BASE64 is missing")
          try:
              raw = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit("RCLONE_CONFIG_BASE64 is invalid") from exc
          if not raw.strip():
              raise SystemExit("Decoded rclone.conf is empty")
          (central / "rclone.conf").write_bytes(raw)

          source = Path("launcher/scripts")
          runtime = central / "runtime"
          runtime.mkdir(parents=True, exist_ok=True)
          if source.is_dir():
              for item in source.iterdir():
                  if item.is_file():
                      shutil.copy2(item, runtime / item.name)
          PY

      - name: Commit central runtime
        working-directory: central
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "DeadZone Automation"
          git config user.email "deadzone-automation@users.noreply.github.com"
          git add build.env rclone.conf runtime/
          if ! git diff --cached --quiet; then
            git commit -m "secrets: centralize active build runtime"
            git push origin HEAD:main
          fi

      - name: Make every edition workflow load its own runtime from DeadZone-Secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("launcher")
          workflow_dir = root / ".github" / "workflows"
          projects = {
              "MEZO_Lite.yml": "lite",
              "gamingplus.yml": "gamingplus",
              "DeadZone_Port.yml": "port",
              "legend.yml": "legend",
              "ninja.yml": "ninja",
              "frameworkpatcher.yml": "frameworkpatcher",
          }

          def gh(expr: str) -> str:
              return "$" + "{{ " + expr + " }}"

          bootstrap = gh("secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN")
          engine = gh("steps.central.outputs.engine_repository")
          module = gh("steps.central.outputs.framework_module_repository")

          secret_env_keys = {
              "BUILD_PROGRESS_SECRET", "TELEGRAM_BOT_TOKEN", "MEZO_PRIVATE_CHAT_ID",
              "TELEGRAM_RELEASE_GROUP_ID", "MEZO_CONTACT_LINK", "UPDATES_GROUP_LINK",
              "SCREENSHOTS_GROUP_LINK", "CHAT_GROUP_LINK", "CHANGELOG_LINK",
              "SCREENSHOTS_POST_LINK", "RCLONE_CONFIG_BASE64", "RCLONE_REMOTE_NAME",
              "RCLONE_UPLOAD_DIR", "RCLONE_PUBLIC_LINK_BASE", "LITE_ENGINE_REPOSITORY",
              "GAMINGPLUS_ENGINE_REPOSITORY", "PORT_ENGINE_REPOSITORY",
              "FRAMEWORK_ENGINE_REPOSITORY", "FRAMEWORK_MODULE_REPOSITORY",
              "RAW_PORT_ENGINE_REPOSITORY", "PRIVATE_REPO_TOKEN", "GH_TOKEN",
              "GH_TOKEN_FALLBACK",
          }

          def remove_direct_secret_env(text: str) -> str:
              lines = text.splitlines(keepends=True)
              kept = []
              for line in lines:
                  stripped = line.lstrip()
                  key = stripped.split(":", 1)[0] if ":" in stripped else ""
                  if key in secret_env_keys and "secrets." in line:
                      continue
                  kept.append(line)

              lines = kept
              result = []
              for i, line in enumerate(lines):
                  if line.strip() != "env:":
                      result.append(line)
                      continue
                  indent = len(line) - len(line.lstrip(" "))
                  j = i + 1
                  while j < len(lines) and not lines[j].strip():
                      j += 1
                  if j >= len(lines):
                      continue
                  next_indent = len(lines[j]) - len(lines[j].lstrip(" "))
                  if next_indent <= indent:
                      continue
                  result.append(line)
              return "".join(result)

          for filename, project in projects.items():
              path = workflow_dir / filename
              if not path.is_file():
                  raise SystemExit(f"Missing workflow: {filename}")

              text = path.read_text(encoding="utf-8")

              for old in (
                  gh("secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN"),
                  gh("secrets.PRIVATE_REPO_TOKEN"),
                  gh("secrets.GH_TOKEN"),
              ):
                  text = text.replace(old, bootstrap)

              replacements = {
                  gh("secrets.LITE_ENGINE_REPOSITORY"): engine,
                  gh("secrets.GAMINGPLUS_ENGINE_REPOSITORY"): engine,
                  gh("secrets.PORT_ENGINE_REPOSITORY"): engine,
                  gh("secrets.FRAMEWORK_ENGINE_REPOSITORY"): engine,
                  gh("secrets.FRAMEWORK_MODULE_REPOSITORY"): module,
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)

              text = text.replace("repository: hypermezo4-create/DeadZone_GamingPlus", "repository: " + engine)
              text = text.replace("repository: hypermezo4-create/DeadZone_Legend", "repository: " + engine)
              text = text.replace("repository: hypermezo4-create/DeadZone_Ninja", "repository: " + engine)

              text = remove_direct_secret_env(text)

              text = text.replace(
                  'bash "$GITHUB_WORKSPACE/scripts/emit_stage.sh"',
                  'bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh"',
              )
              text = text.replace(
                  "bash scripts/emit_stage.sh",
                  'bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh"',
              )
              text = text.replace(
                  "python3 scripts/send_telemetry.py",
                  'python3 "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/send_telemetry.py"',
              )

              if ".deadzone-secrets/load-build.sh" not in text:
                  match = re.search(r"(?mi)^\s{6}- name: .*checkout.*launcher.*$", text)
                  if match is None:
                      raise SystemExit(f"Could not find launcher checkout in {filename}")
                  marker = text.find("persist-credentials: false", match.end())
                  if marker < 0:
                      raise SystemExit(f"Could not find launcher checkout end in {filename}")
                  end = text.find("\n", marker)
                  end = len(text) if end < 0 else end + 1
                  block = (
                      "\n"
                      "      - name: Load DeadZone secrets\n"
                      "        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683\n"
                      "        with:\n"
                      "          repository: mohammedmezo99/DeadZone-Secrets\n"
                      f"          token: {bootstrap}\n"
                      "          ref: main\n"
                      "          path: .deadzone-secrets\n"
                      "          fetch-depth: 1\n"
                      "          persist-credentials: false\n"
                      "\n"
                      "      - name: Import project secrets\n"
                      "        id: central\n"
                      "        shell: bash\n"
                      "        env:\n"
                      f"          DEADZONE_PRIVATE_TOKEN: {bootstrap}\n"
                      f"        run: bash .deadzone-secrets/load-build.sh {project}\n"
                  )
                  text = text[:end] + block + text[end:]

              if "scripts/" in text:
                  raise SystemExit(f"Public scripts dependency remains in {filename}")

              path.write_text(text, encoding="utf-8")

          # End state: only the six real edition workflows remain.
          for path in workflow_dir.iterdir():
              if path.is_file() and path.name not in projects:
                  path.unlink()
          PY

      - name: Remove everything except the edition workflows
        working-directory: launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/workflows/MEZO_Lite.yml|\
              .github/workflows/gamingplus.yml|\
              .github/workflows/DeadZone_Port.yml|\
              .github/workflows/legend.yml|\
              .github/workflows/ninja.yml|\
              .github/workflows/frameworkpatcher.yml)
                ;;
              *)
                git rm -f -- "$file" 2>/dev/null || true
                ;;
            esac
          done < <(git ls-files -z)
          git add -A .github/workflows

      - name: Commit workflow-only DeadZone-Build
        working-directory: launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "DeadZone Automation"
          git config user.email "deadzone-automation@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "build: keep edition workflows only and load central secrets"
          git push origin HEAD:main
