name: "DeadZone • Migrate Secrets"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CENTRAL_TOKEN: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
      BUILD_PROGRESS_SECRET: ${{ secrets.BUILD_PROGRESS_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      MEZO_PRIVATE_CHAT_ID: ${{ secrets.MEZO_PRIVATE_CHAT_ID }}
      TELEGRAM_RELEASE_GROUP_ID: ${{ secrets.TELEGRAM_RELEASE_GROUP_ID }}
      MEZO_CONTACT_LINK: ${{ secrets.MEZO_CONTACT_LINK }}
      UPDATES_GROUP_LINK: ${{ secrets.UPDATES_GROUP_LINK }}
      SCREENSHOTS_GROUP_LINK: ${{ secrets.SCREENSHOTS_GROUP_LINK }}
      CHAT_GROUP_LINK: ${{ secrets.CHAT_GROUP_LINK }}
      CHANGELOG_LINK: ${{ secrets.CHANGELOG_LINK }}
      SCREENSHOTS_POST_LINK: ${{ secrets.SCREENSHOTS_POST_LINK }}
      RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
      RCLONE_REMOTE_NAME: ${{ secrets.RCLONE_REMOTE_NAME }}
      RCLONE_UPLOAD_DIR: ${{ secrets.RCLONE_UPLOAD_DIR }}
      RCLONE_PUBLIC_LINK_BASE: ${{ secrets.RCLONE_PUBLIC_LINK_BASE }}

    steps:
      - name: Validate central repository credential
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${CENTRAL_TOKEN:-}" ]] || {
            echo "Missing DEADZONE_PRIVATE_TOKEN / PRIVATE_REPO_TOKEN / GH_TOKEN" >&2
            exit 1
          }

      - name: Checkout public launcher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: launcher
          fetch-depth: 1
          persist-credentials: true

      - name: Checkout private DeadZone-Secrets
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mohammedmezo99/DeadZone-Secrets
          token: ${{ env.CENTRAL_TOKEN }}
          ref: main
          path: central
          fetch-depth: 1
          persist-credentials: true

      - name: Migrate current build values without logging them
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import os
          import shlex
          import shutil
          from pathlib import Path

          root = Path("central")
          keys = [
              "BUILD_PROGRESS_SECRET",
              "TELEGRAM_BOT_TOKEN",
              "MEZO_PRIVATE_CHAT_ID",
              "TELEGRAM_RELEASE_GROUP_ID",
              "MEZO_CONTACT_LINK",
              "UPDATES_GROUP_LINK",
              "SCREENSHOTS_GROUP_LINK",
              "CHAT_GROUP_LINK",
              "CHANGELOG_LINK",
              "SCREENSHOTS_POST_LINK",
              "RCLONE_REMOTE_NAME",
              "RCLONE_UPLOAD_DIR",
              "RCLONE_PUBLIC_LINK_BASE",
          ]

          values = {key: os.environ.get(key, "") for key in keys}
          if not values["UPDATES_GROUP_LINK"]:
              values["UPDATES_GROUP_LINK"] = "https://t.me/xDeadZone"
          if not values["CHAT_GROUP_LINK"]:
              values["CHAT_GROUP_LINK"] = "https://t.me/DeadZoneDiscussion"

          required = ["BUILD_PROGRESS_SECRET", "RCLONE_REMOTE_NAME", "RCLONE_UPLOAD_DIR"]
          missing = [key for key in required if not values[key]]
          if missing:
              raise SystemExit("Required existing build secrets are missing: " + ", ".join(missing))

          lines = [
              "# Central DeadZone build runtime values.",
              "# Migrated automatically from DeadZone-Build Actions secrets.",
              "",
          ]
          for key in keys:
              lines.append(f"{key}={shlex.quote(values[key])}")
          lines.extend(["", "# Rclone connection data lives in rclone.conf.", ""])
          (root / "build.env").write_text("\n".join(lines), encoding="utf-8")

          encoded = os.environ.get("RCLONE_CONFIG_BASE64", "").strip()
          if not encoded:
              raise SystemExit("RCLONE_CONFIG_BASE64 is missing from existing Actions secrets")
          try:
              raw = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit("RCLONE_CONFIG_BASE64 is not valid base64") from exc
          if not raw.strip():
              raise SystemExit("Decoded rclone.conf is empty")
          (root / "rclone.conf").write_bytes(raw)

          source_scripts = Path("launcher/scripts")
          target_scripts = root / "runtime" / "launcher"
          if source_scripts.is_dir():
              shutil.rmtree(target_scripts, ignore_errors=True)
              shutil.copytree(source_scripts, target_scripts)
          PY

      - name: Commit private runtime source
        working-directory: central
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "DeadZone Automation"
          git config user.email "deadzone-automation@users.noreply.github.com"
          git add build.env rclone.conf runtime/
          if git diff --cached --quiet; then
            echo "Central runtime is already current."
          else
            git commit -m "secrets: migrate active launcher runtime"
            git push origin HEAD:main
            echo "Central runtime migrated."
          fi

      - name: Convert public workflows to central runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("launcher")
          workflows = {
              ".github/workflows/MEZO_Lite.yml": "lite",
              ".github/workflows/gamingplus.yml": "gamingplus",
              ".github/workflows/DeadZone_Port.yml": "port",
              ".github/workflows/legend.yml": "legend",
              ".github/workflows/ninja.yml": "ninja",
              ".github/workflows/frameworkpatcher.yml": "frameworkpatcher",
          }

          def gh(expression: str) -> str:
              return "$" + "{{ " + expression + " }}"

          bootstrap = gh("secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN")
          engine_output = gh("steps.central.outputs.engine_repository")
          module_output = gh("steps.central.outputs.framework_module_repository")

          old_token_expressions = [
              gh("secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN"),
              gh("secrets.PRIVATE_REPO_TOKEN"),
              gh("secrets.GH_TOKEN"),
          ]
          repo_expressions = {
              gh("secrets.LITE_ENGINE_REPOSITORY"): engine_output,
              gh("secrets.GAMINGPLUS_ENGINE_REPOSITORY"): engine_output,
              gh("secrets.PORT_ENGINE_REPOSITORY"): engine_output,
              gh("secrets.FRAMEWORK_ENGINE_REPOSITORY"): engine_output,
              gh("secrets.FRAMEWORK_MODULE_REPOSITORY"): module_output,
          }
          remove_env_keys = {
              "BUILD_PROGRESS_SECRET", "TELEGRAM_BOT_TOKEN", "MEZO_PRIVATE_CHAT_ID",
              "TELEGRAM_RELEASE_GROUP_ID", "MEZO_CONTACT_LINK", "UPDATES_GROUP_LINK",
              "SCREENSHOTS_GROUP_LINK", "CHAT_GROUP_LINK", "CHANGELOG_LINK",
              "SCREENSHOTS_POST_LINK", "RCLONE_CONFIG_BASE64", "RCLONE_REMOTE_NAME",
              "RCLONE_UPLOAD_DIR", "RCLONE_PUBLIC_LINK_BASE", "LITE_ENGINE_REPOSITORY",
              "GAMINGPLUS_ENGINE_REPOSITORY", "PORT_ENGINE_REPOSITORY",
              "FRAMEWORK_ENGINE_REPOSITORY", "FRAMEWORK_MODULE_REPOSITORY",
              "RAW_PORT_ENGINE_REPOSITORY", "PRIVATE_REPO_TOKEN", "GH_TOKEN",
              "GH_TOKEN_FALLBACK",
          }

          def remove_secret_env_lines(text: str) -> str:
              kept = []
              for line in text.splitlines(keepends=True):
                  stripped = line.lstrip()
                  key = stripped.split(":", 1)[0] if ":" in stripped else ""
                  if key in remove_env_keys and "secrets." in line:
                      continue
                  kept.append(line)
              lines = "".join(kept).splitlines(keepends=True)
              cleaned = []
              for index, line in enumerate(lines):
                  if line.strip() != "env:":
                      cleaned.append(line)
                      continue
                  indent = len(line) - len(line.lstrip(" "))
                  probe = index + 1
                  while probe < len(lines) and not lines[probe].strip():
                      probe += 1
                  if probe >= len(lines):
                      continue
                  next_indent = len(lines[probe]) - len(lines[probe].lstrip(" "))
                  if next_indent <= indent:
                      continue
                  cleaned.append(line)
              return "".join(cleaned)

          for relative, project in workflows.items():
              path = root / relative
              if not path.is_file():
                  print(f"SKIP missing workflow: {relative}")
                  continue
              text = path.read_text(encoding="utf-8")

              for old in old_token_expressions:
                  text = text.replace(old, bootstrap)
              for old, new in repo_expressions.items():
                  text = text.replace(old, new)

              text = text.replace("repository: hypermezo4-create/DeadZone_GamingPlus", "repository: " + engine_output)
              text = text.replace("repository: hypermezo4-create/DeadZone_Legend", "repository: " + engine_output)
              text = text.replace("repository: hypermezo4-create/DeadZone_Ninja", "repository: " + engine_output)

              text = remove_secret_env_lines(text)

              text = text.replace(
                  'bash "$GITHUB_WORKSPACE/scripts/emit_stage.sh"',
                  'bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh"',
              )
              text = text.replace(
                  "bash scripts/emit_stage.sh",
                  'bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh"',
              )
              text = text.replace(
                  "python3 scripts/send_telemetry.py",
                  'python3 "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/send_telemetry.py"',
              )

              if ".deadzone-secrets/load-build.sh" not in text:
                  match = re.search(r"(?m)^\s{6}- name: [^\n]*Checkout[^\n]*launcher[^\n]*$", text)
                  if match is None:
                      raise SystemExit(f"Unable to find launcher checkout in {relative}")
                  credentials = text.find("persist-credentials: false", match.end())
                  if credentials < 0:
                      raise SystemExit(f"Unable to find launcher checkout end in {relative}")
                  insertion = text.find("\n", credentials)
                  insertion = len(text) if insertion < 0 else insertion + 1
                  block = (
                      "\n"
                      "      - name: Load private DeadZone runtime\n"
                      "        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683\n"
                      "        with:\n"
                      "          repository: mohammedmezo99/DeadZone-Secrets\n"
                      f"          token: {bootstrap}\n"
                      "          ref: main\n"
                      "          path: .deadzone-secrets\n"
                      "          fetch-depth: 1\n"
                      "          persist-credentials: false\n"
                      "\n"
                      "      - name: Import DeadZone runtime\n"
                      "        id: central\n"
                      "        shell: bash\n"
                      "        env:\n"
                      f"          DEADZONE_PRIVATE_TOKEN: {bootstrap}\n"
                      f"        run: bash .deadzone-secrets/load-build.sh {project}\n"
                  )
                  text = text[:insertion] + block + text[insertion:]

              path.write_text(text, encoding="utf-8")

          leftovers = []
          for path in (root / ".github" / "workflows").glob("*.yml"):
              if path.name == "_migrate_deadzone_secrets.yml":
                  continue
              content = path.read_text(encoding="utf-8")
              if "scripts/" in content:
                  leftovers.append(path.name)
          if leftovers:
              raise SystemExit("Public workflows still reference launcher scripts: " + ", ".join(sorted(leftovers)))
          PY

      - name: Remove migrated public helper scripts and migration workflow
        working-directory: launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d scripts ]]; then
            git rm -r scripts
          fi
          git rm .github/workflows/_migrate_deadzone_secrets.yml

      - name: Commit workflow-only public launcher
        working-directory: launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "DeadZone Automation"
          git config user.email "deadzone-automation@users.noreply.github.com"
          git add .github/workflows
          if git diff --cached --quiet; then
            echo "Launcher already uses central runtime."
            exit 0
          fi
          git commit -m "build: load private runtime from DeadZone-Secrets"
          git push origin HEAD:main
          echo "Public launcher conversion complete."
