name: "Certify Zircon Runtime Geometry V7"
run-name: "Certify Zircon Runtime Geometry V7  ${{ github.run_id }}"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/certify-zircon-os3-v7.yml
      - .github/certification/machine-bundle-url.txt

permissions:
  contents: write

concurrency:
  group: certify-zircon-runtime-super-geometry-v7
  cancel-in-progress: true

env:
  ROM_URL: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.303.0.WNOCNXM/zircon-ota_full-OS3.0.303.0.WNOCNXM-user-16.0-09c35a83d6.zip"

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DEADZONE_PROJECT: lite
      DEADZONE_EDITION_REPOSITORY: mohammedmezo99/DeadZone_Lite
      DEADZONE_EDITION_REF: main

    steps:
      - name: Checkout certification launcher
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Record certification run
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .github/certification
          jq -n \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg commit "$GITHUB_SHA" \
            --arg rom "zircon-OS3.0.303.0.WNOCNXM" \
            '{run_id:$run_id,commit:$commit,rom:$rom,status:"started",geometry:"runtime-evidence-only",edition_contract:1,workflow:"v7"}' \
            > .github/certification/zircon-run-v7.json
          git config user.name deadzone-certification
          git config user.email actions@users.noreply.github.com
          git add .github/certification/zircon-run-v7.json
          git commit -m 'Record Zircon V7 certification run'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Download and verify Machine bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/machine-certification-bundle.zip"
          payload="$RUNNER_TEMP/machine-certification-payload"
          bundle_url=$(tr -d '\r\n' < .github/certification/machine-bundle-url.txt)
          [[ "$bundle_url" == https://* ]] || { echo 'Invalid Machine bundle URL' >&2; exit 1; }
          rm -rf "$payload"
          mkdir -p "$payload"
          curl --fail --location --show-error --retry 5 --retry-all-errors \
            "$bundle_url" --output "$archive"
          unzip -q "$archive" -d "$payload"
          (cd "$payload" && sha256sum -c deadzone-machine-certification.tar.gz.sha256)

      - name: Maximize build workspace
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-docker-images: "true"

      - name: Load DeadZone secrets
        uses: actions/checkout@v5
        with:
          repository: mohammedmezo99/DeadZone-Secrets
          token: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: main
          path: .deadzone-secrets
          fetch-depth: 1
          persist-credentials: false

      - name: Import Lite runtime
        shell: bash
        env:
          DEADZONE_PRIVATE_TOKEN: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: bash .deadzone-secrets/load-build.sh lite

      - name: Extract verified Machine
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$RUNNER_TEMP/machine-certification-payload"
          rm -rf machine
          mkdir -p machine
          tar -xzf "$payload/deadzone-machine-certification.tar.gz" -C machine
          [[ -x machine/bin/deadzone-machine ]]
          [[ -s machine/checks/verify_edition_manifest.sh ]]
          test ! -e machine/config/SuperConfig/zircon/super
          test ! -e machine/core/rebuild/super_config.py
          grep -q 'as $required' machine/core/edition.sh

      - name: Checkout Lite Edition
        uses: actions/checkout@v5
        with:
          repository: mohammedmezo99/DeadZone_Lite
          token: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: main
          path: edition
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Prepare runner and verify Machine
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo timedatectl set-timezone Africa/Cairo
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl file git jq openjdk-17-jre-headless python3 tar unzip xz-utils
          make -C machine ci
          machine/bin/deadzone-machine doctor --json | tee machine-doctor.json
          bash -n edition/edition/run.sh
          jq -e '.schema_version == 1 and .machine_api == 1 and .id == "lite"' edition/edition/manifest.json >/dev/null

      - name: Create certification request
        shell: bash
        run: |
          set -Eeuo pipefail
          request_id="DZ-LT-RUNTIME-SUPER-V7-${GITHUB_RUN_ID}"
          echo "REQUEST_ID=$request_id" >> "$GITHUB_ENV"
          echo "::add-mask::$ROM_URL"
          jq -n \
            --arg request_id "$request_id" \
            --arg source "$ROM_URL" \
            --arg repository "$DEADZONE_EDITION_REPOSITORY" \
            --arg ref "$DEADZONE_EDITION_REF" \
            '{request_id:$request_id,rom:{source:$source},edition:{id:"lite",repository:$repository,ref:$ref},builder:{id:"0",name:"DeadZone Runtime Super V7 Certification"}}' \
            > request.json
          echo "DEADZONE_UPLOAD_ROOT=${RCLONE_UPLOAD_DIR%/}/certification/zircon-runtime-super-v7/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Run DeadZone Machine on Zircon
        shell: bash
        env:
          DEADZONE_EDITION_SOURCE_DIR: ${{ github.workspace }}/edition
        run: |
          set -Eeuo pipefail
          sudo -E env \
            PATH="$PATH" HOME="$HOME" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            DEADZONE_EDITION_SOURCE_DIR="$DEADZONE_EDITION_SOURCE_DIR" \
            DEADZONE_CONTROLLED_BUILD="0" \
            DEADZONE_PROJECT="lite" \
            REQUEST_ID="$REQUEST_ID" \
            REQUEST_SOURCE="github-certification" \
            RCLONE_CONFIG_BASE64="$RCLONE_CONFIG_BASE64" \
            RCLONE_REMOTE_NAME="$RCLONE_REMOTE_NAME" \
            RCLONE_UPLOAD_DIR="$DEADZONE_UPLOAD_ROOT" \
            bash machine/machine.sh --request "$GITHUB_WORKSPACE/request.json" \
            2>&1 | tee deadzone-machine.log

      - name: Verify runtime geometry and final result
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime="machine/runtime/builds/${REQUEST_ID}"
          source_geometry="$runtime/metadata/super/source.json"
          result="$runtime/reports/delivery/deadzone-result.json"
          release="$runtime/output/manifests/release.json"
          build="$runtime/reports/build-result.json"
          for file in "$source_geometry" "$result" "$release" "$build"; do
            [[ -s "$file" ]] || { echo "Missing certification file: $file" >&2; exit 1; }
          done
          jq -e \
            '.super_size == 9126805504
             and .super_size_source == "matching-fastboot-partition-table"
             and .geometry_confidence == "exact"
             and .geometry_evidence.source_type == "mediatek-scatter"
             and (.geometry_evidence.source_member | test("scatter"; "i"))' \
            "$source_geometry" >/dev/null
          jq -e --arg request_id "$REQUEST_ID" \
            '.schema_version == "1.0" and .status == "success" and .project == "lite" and .request_id == $request_id and .codename == "zircon"' \
            "$result" >/dev/null
          cp -- "$source_geometry" runtime-super-evidence.json
          cp -- "$result" deadzone-result.json
          cp -- "$release" certification-release.json
          cp -- "$build" certification-build-result.json

      - name: Upload certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: zircon-runtime-super-v7-${{ env.REQUEST_ID }}
          path: |
            runtime-super-evidence.json
            deadzone-result.json
            certification-release.json
            certification-build-result.json
            machine-doctor.json
            deadzone-machine.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload compact failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: zircon-runtime-super-v7-diagnostics-${{ env.REQUEST_ID || github.run_id }}
          path: |
            deadzone-machine.log
            machine-doctor.json
            request.json
            machine/runtime/builds/${{ env.REQUEST_ID }}/metadata/super/*.json
            machine/runtime/builds/${{ env.REQUEST_ID }}/metadata/ota-metadata.json
            machine/runtime/builds/${{ env.REQUEST_ID }}/metadata/edition-manifest.json
            machine/runtime/builds/${{ env.REQUEST_ID }}/edition/result.json
            machine/runtime/builds/${{ env.REQUEST_ID }}/reports/analysis/*.json
            machine/runtime/builds/${{ env.REQUEST_ID }}/reports/rebuild/*.json
            machine/runtime/builds/${{ env.REQUEST_ID }}/checkpoints/*.json
            machine/runtime/builds/${{ env.REQUEST_ID }}/logs/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup temporary credentials
        if: always()
        shell: bash
        run: sudo rm -f -- "machine/runtime/builds/${REQUEST_ID:-unknown}/state/rclone.conf"
