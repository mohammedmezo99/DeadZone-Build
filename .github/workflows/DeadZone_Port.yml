name: "🔄 DeadZone Port"

run-name: "🔄 DeadZone Port • ${{ inputs.request_id || github.actor }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Bot request ID. Leave empty for a manual GitHub build."
        required: false
        type: string
      stock_rom_link:
        description: "Stock ROM HTTPS link for a manual Port build."
        required: false
        type: string
      port_rom_link:
        description: "Donor / Port ROM HTTPS link for a manual Port build."
        required: false
        type: string
      builder_label:
        description: "Optional builder label for a manual build."
        required: false
        type: string
      language:
        description: "Build language for a manual GitHub run."
        required: false
        default: "en"
        type: choice
        options: ["en", "ar"]
  workflow_call:
    inputs:
      request_id:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deadzone-port-build-queue
  queue: max
  cancel-in-progress: false

jobs:
  build:
    name: "🔄 Build DeadZone Port"
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CONTROL_BOT_CONTRACT_URL: https://deadzone-mezo-v3-20260726.fly.dev/contract/resolve
      CONTROL_BOT_TELEMETRY_URL: https://deadzone-mezo-v3-20260726.fly.dev/telemetry
      DEADZONE_PROJECT: port

    steps:
      - name: "⚡ Maximize Port build space"
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-docker-images: "true"

      - name: "📥 Checkout DeadZone launcher"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "🔐 Load DeadZone secrets"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mohammedmezo99/DeadZone-Secrets
          token: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: main
          path: .deadzone-secrets
          fetch-depth: 1
          persist-credentials: false

      - name: "🔑 Import Port runtime"
        id: central
        shell: bash
        env:
          DEADZONE_PRIVATE_TOKEN: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: bash .deadzone-secrets/load-build.sh port

      - name: "🔐 Resolve Port build mode"
        id: mode
        shell: bash
        env:
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
          INPUT_STOCK_ROM_LINK: ${{ inputs.stock_rom_link }}
          INPUT_PORT_ROM_LINK: ${{ inputs.port_rom_link }}
          INPUT_BUILDER_LABEL: ${{ inputs.builder_label }}
          INPUT_LANGUAGE: ${{ inputs.language }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${INPUT_REQUEST_ID:-}" ]]; then
            [[ "$INPUT_REQUEST_ID" =~ ^DZ-PT-[0-9]{8}-[0-9]{4}$ ]] || { echo "Invalid DeadZone Port request ID" >&2; exit 1; }
            [[ -n "${BUILD_PROGRESS_SECRET:-}" ]] || { echo "Missing BUILD_PROGRESS_SECRET" >&2; exit 1; }
            export REQUEST_ID="$INPUT_REQUEST_ID"
            python3 - <<'PY'
          import base64, hashlib, hmac, json, os, re, urllib.request
          from datetime import datetime, timezone

          secret = os.environ["BUILD_PROGRESS_SECRET"]
          request_id = os.environ["REQUEST_ID"]
          payload = {"schema_version":"1.0","request_id":request_id,"project":"port","timestamp":datetime.now(timezone.utc).isoformat()}
          body = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          signature = hmac.new(secret.encode(), body, hashlib.sha256).hexdigest()
          req = urllib.request.Request(os.environ["CONTROL_BOT_CONTRACT_URL"], data=body, method="POST", headers={"Content-Type":"application/json","X-DeadZone-Signature":signature})
          with urllib.request.urlopen(req, timeout=20) as response:
              response_body = response.read()
              response_signature = response.headers.get("X-DeadZone-Signature", "")
          expected = hmac.new(secret.encode(), response_body, hashlib.sha256).hexdigest()
          if not hmac.compare_digest(expected, response_signature):
              raise SystemExit("Invalid control response signature")

          contract = json.loads(response_body)
          if contract.get("request_id") != request_id or contract.get("project") != "port":
              raise SystemExit("Private contract mismatch")

          port_url = str((contract.get("source") or {}).get("url") or "")
          options = contract.get("options") if isinstance(contract.get("options"), dict) else {}
          stock_url = str(options.get("stock_rom_url") or "")
          builder = contract.get("builder") or {}
          live = contract.get("live_message") or {}
          builder_id = int(builder.get("telegram_user_id") or 0)
          builder_slug = str(builder.get("slug") or "")
          builder_name = str(builder.get("display_name") or builder.get("username") or builder_slug or "DeadZone Builder")
          language = "ar" if str(contract.get("language") or "").lower() == "ar" else "en"
          status_chat_id = int(live.get("chat_id") or 0)
          status_message_id = int(live.get("message_id") or 0)

          if not stock_url.startswith("https://") or not port_url.startswith("https://"):
              raise SystemExit("DeadZone Port requires both Stock and Port HTTPS sources")
          if builder_id <= 0 or not re.fullmatch(r"[a-z0-9_.-]{1,48}", builder_slug):
              raise SystemExit("Builder identity is invalid")
          if status_chat_id == 0 or status_message_id <= 0:
              raise SystemExit("Port live-message contract is missing")

          print(f"::add-mask::{stock_url}")
          print(f"::add-mask::{port_url}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"REQUEST_ID={request_id}\n")
              out.write("STOCK_ROM_URL_B64=" + base64.b64encode(stock_url.encode()).decode() + "\n")
              out.write("PORT_ROM_URL_B64=" + base64.b64encode(port_url.encode()).decode() + "\n")
              out.write(f"BUILDER_ID={builder_id}\nBUILDER_SLUG={builder_slug}\n")
              out.write("BUILDER_NAME_B64=" + base64.b64encode(builder_name.encode()).decode() + "\n")
              out.write(f"DEADZONE_LANGUAGE={language}\n")
              out.write(f"TELEGRAM_MSG_CHAT_ID={status_chat_id}\nTELEGRAM_MSG_ID={status_message_id}\n")
              out.write("REQUEST_SOURCE=telegram\nDEADZONE_CONTROLLED_BUILD=1\n")
          PY
            echo "mode=bot" >> "$GITHUB_OUTPUT"
          else
            [[ "${INPUT_STOCK_ROM_LINK:-}" == https://* ]] || { echo "Manual Port build requires stock_rom_link" >&2; exit 1; }
            [[ "${INPUT_PORT_ROM_LINK:-}" == https://* ]] || { echo "Manual Port build requires port_rom_link" >&2; exit 1; }
            echo "::add-mask::$INPUT_STOCK_ROM_LINK"
            echo "::add-mask::$INPUT_PORT_ROM_LINK"
            builder="${INPUT_BUILDER_LABEL:-${GITHUB_ACTOR}}"
            language="${INPUT_LANGUAGE:-en}"
            [[ "$language" == "ar" ]] || language="en"
            {
              echo "REQUEST_ID=DZ-PT-DIRECT-${GITHUB_RUN_ID}"
              echo "STOCK_ROM_URL_B64=$(printf '%s' "$INPUT_STOCK_ROM_LINK" | base64 -w0)"
              echo "PORT_ROM_URL_B64=$(printf '%s' "$INPUT_PORT_ROM_LINK" | base64 -w0)"
              echo "BUILDER_ID=0"
              echo "BUILDER_SLUG=github"
              echo "BUILDER_NAME_B64=$(printf '%s' "$builder" | base64 -w0)"
              echo "DEADZONE_LANGUAGE=$language"
              echo "REQUEST_SOURCE=github"
              echo "DEADZONE_CONTROLLED_BUILD=0"
            } >> "$GITHUB_ENV"
            echo "mode=manual" >> "$GITHUB_OUTPUT"
          fi
          echo "BUILD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: "📡 Prepare DeadZone Port"
        if: steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" preparing in_progress 0 "Preparing the DeadZone Port dual-ROM pipeline." || true

      - name: "🛡️ Resolve Port engine access"
        id: engine_auth
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_PORT_ENGINE_REPOSITORY="${RAW_PORT_ENGINE_REPOSITORY:-${PORT_ENGINE_REPOSITORY:-}}"
          for key in RAW_PORT_ENGINE_REPOSITORY RCLONE_CONFIG_BASE64 RCLONE_REMOTE_NAME RCLONE_UPLOAD_DIR; do
            [[ -n "${!key:-}" ]] || { echo "Missing required configuration: $key" >&2; exit 1; }
          done
          [[ -n "${PRIVATE_REPO_TOKEN:-}" || -n "${GH_TOKEN_FALLBACK:-}" ]] || {
            echo "Missing private engine credential: PRIVATE_REPO_TOKEN or GH_TOKEN" >&2
            exit 1
          }

          repo="$(printf '%s' "$RAW_PORT_ENGINE_REPOSITORY" | tr -d '\r\n')"
          repo="${repo#https://github.com/}"
          repo="${repo#http://github.com/}"
          repo="${repo#github.com/}"
          repo="${repo%/}"
          repo="${repo%.git}"
          repo="${repo%/}"
          [[ "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "PORT_ENGINE_REPOSITORY must resolve to owner/repository" >&2
            exit 1
          }
          echo "::add-mask::$repo"

          can_read_engine() {
            local token="$1" auth
            [[ -n "$token" ]] || return 1
            auth="$(printf 'x-access-token:%s' "$token" | base64 -w0)"
            GIT_TERMINAL_PROMPT=0 git \
              -c credential.helper= \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
              ls-remote --exit-code "https://github.com/${repo}.git" refs/heads/main >/dev/null 2>&1
          }

          if can_read_engine "$PRIVATE_REPO_TOKEN"; then
            token_source=private
          elif can_read_engine "${GH_TOKEN_FALLBACK:-}"; then
            token_source=gh
          else
            echo "Configured private-repository credentials cannot read the Port engine main branch" >&2
            exit 1
          fi

          {
            echo "repository=$repo"
            echo "token_source=$token_source"
          } >> "$GITHUB_OUTPUT"
          echo "Private Port engine access verified"

      - name: "🔄 Load Port engine"
        if: steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" loading_engine in_progress 1 "Loading the DeadZone Port engine." || true

      - name: "📥 Checkout private Port engine"
        if: steps.engine_auth.outputs.token_source == 'private'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ steps.engine_auth.outputs.repository }}
          token: ${{ env.PRIVATE_REPO_TOKEN }}
          ref: main
          path: engine
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: "📥 Checkout Port engine with fallback credential"
        if: steps.engine_auth.outputs.token_source == 'gh'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ steps.engine_auth.outputs.repository }}
          token: ${{ env.GH_TOKEN_FALLBACK }}
          ref: main
          path: engine
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: "☕ Prepare Java 17"
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "17"

      - name: "🔎 Validate Port engine"
        working-directory: engine
        shell: bash
        run: |
          set -Eeuo pipefail
          export WORK_DIR="$PWD"
          source bin/core/runtime.sh
          runtime_init
          echo "DEADZONE_RUNTIME_PREINITIALIZED=1" >> "$GITHUB_ENV"
          bash bin/core/ci/validate.sh
          bash bin/core/ci/smoke-port-merge.sh

      - name: "🧰 Prepare Port tools"
        if: steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" installing_tools in_progress 2 "Preparing the Port extraction, patching and Super toolchain." || true

      - name: "⚙️ Install Port dependencies"
        working-directory: engine
        shell: bash
        run: |
          set -Eeuo pipefail
          bash bin/core/ci/setup.sh 2>&1 | tee build_action.log
          find . -type f -name '*.sh' -exec chmod +x {} +
          chmod +x build.sh packROM.sh uploadROM.sh
          bash -n build.sh
          bash -n packROM.sh
          bash -n uploadROM.sh

      - name: "🛠️ Build DeadZone Port"
        working-directory: engine
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${DEADZONE_CONTROLLED_BUILD:-0}" == "1" ]]; then
            bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" building in_progress 3 "Merging Stock and donor ROMs and applying DeadZone Port modifications." || true
          fi
          stock_rom="$(printf '%s' "$STOCK_ROM_URL_B64" | base64 --decode)"
          port_rom="$(printf '%s' "$PORT_ROM_URL_B64" | base64 --decode)"
          export BUILDER_NAME="$(printf '%s' "$BUILDER_NAME_B64" | base64 --decode)"
          export STOCK_ROM_URL="$stock_rom"
          export PORT_ROM_URL="$port_rom"
          export INPUT_URL="$port_rom"
          sudo -E env \
            "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            "STOCK_ROM_URL=$STOCK_ROM_URL" "PORT_ROM_URL=$PORT_ROM_URL" "INPUT_URL=$INPUT_URL" \
            "BUILDER_NAME=$BUILDER_NAME" "BUILDER_ID=${BUILDER_ID:-0}" "BUILDER_SLUG=${BUILDER_SLUG:-github}" \
            "DEADZONE_LANGUAGE=${DEADZONE_LANGUAGE:-en}" "DEADZONE_CONTROLLED_BUILD=${DEADZONE_CONTROLLED_BUILD:-0}" \
            "TELEGRAM_MSG_CHAT_ID=${TELEGRAM_MSG_CHAT_ID:-}" "TELEGRAM_MSG_ID=${TELEGRAM_MSG_ID:-}" \
            "REQUEST_ID=$REQUEST_ID" "DEADZONE_RUNTIME_PREINITIALIZED=1" \
            bash build.sh "$stock_rom" "$port_rom" 2>&1 | tee -a build_action.log

      - name: "📦 Package DeadZone Port"
        working-directory: engine
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${DEADZONE_CONTROLLED_BUILD:-0}" == "1" ]]; then
            bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" packaging in_progress 4 "Repacking Port partitions and validating the generated Super image." || true
          fi
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" bash packROM.sh 2>&1 | tee -a build_action.log
          [[ -s build/baserom/images/super.img ]] || { echo "super.img is missing after Port packaging" >&2; exit 1; }

      - name: "🔎 Verify Port package"
        working-directory: engine
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${DEADZONE_CONTROLLED_BUILD:-0}" == "1" ]]; then
            bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" preparing_upload in_progress 5 "Verifying the Port package before private delivery." || true
          fi
          output="$(cat bin/runtime/info/output_zip.txt 2>/dev/null || cat bin/runtime/info/output_file.txt 2>/dev/null || true)"
          output_path="$(cat bin/runtime/info/output_path.txt 2>/dev/null || true)"
          artifact="${output_path:-out/$output}"
          [[ -n "$output" && -s "$artifact" ]] || { echo "Port output archive is missing before upload" >&2; exit 1; }

      - name: "☁️ Upload DeadZone Port"
        working-directory: engine
        shell: bash
        run: |
          set -Eeuo pipefail
          base_dir="${RCLONE_UPLOAD_DIR%/}"
          if [[ "${DEADZONE_CONTROLLED_BUILD:-0}" == "1" ]]; then
            export RCLONE_UPLOAD_DIR="${base_dir}/port/${BUILDER_SLUG}_${BUILDER_ID}/${REQUEST_ID}"
            bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" uploading in_progress 6 "Uploading the verified DeadZone Port package to DeadZone Cloud." || true
          else
            export RCLONE_UPLOAD_DIR="${base_dir}/port/direct/${GITHUB_ACTOR}/${GITHUB_RUN_ID}"
          fi
          sudo -E env \
            "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            "RCLONE_CONFIG_BASE64=$RCLONE_CONFIG_BASE64" "RCLONE_REMOTE_NAME=$RCLONE_REMOTE_NAME" \
            "RCLONE_UPLOAD_DIR=$RCLONE_UPLOAD_DIR" "RCLONE_PUBLIC_LINK_BASE=${RCLONE_PUBLIC_LINK_BASE:-}" \
            "DEADZONE_CONTROLLED_BUILD=${DEADZONE_CONTROLLED_BUILD:-0}" "REQUEST_ID=$REQUEST_ID" \
            "BUILDER_ID=${BUILDER_ID:-0}" "BUILDER_SLUG=${BUILDER_SLUG:-github}" \
            bash uploadROM.sh setup 2>&1 | tee -a build_action.log
          sudo -E env \
            "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            "RCLONE_CONFIG_BASE64=$RCLONE_CONFIG_BASE64" "RCLONE_REMOTE_NAME=$RCLONE_REMOTE_NAME" \
            "RCLONE_UPLOAD_DIR=$RCLONE_UPLOAD_DIR" "RCLONE_PUBLIC_LINK_BASE=${RCLONE_PUBLIC_LINK_BASE:-}" \
            "DEADZONE_CONTROLLED_BUILD=${DEADZONE_CONTROLLED_BUILD:-0}" "REQUEST_ID=$REQUEST_ID" \
            "BUILDER_ID=${BUILDER_ID:-0}" "BUILDER_SLUG=${BUILDER_SLUG:-github}" \
            bash uploadROM.sh 2>&1 | tee -a build_action.log
          if [[ "${DEADZONE_CONTROLLED_BUILD:-0}" == "1" ]]; then
            bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" finalizing in_progress 7 "Final integrity verification for DeadZone Port." || true
          fi

      - name: "✅ Create Port result contract"
        working-directory: engine
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit

          def first(paths):
              for raw in paths:
                  path = Path(raw)
                  if path.is_file():
                      value = path.read_text(encoding="utf-8", errors="replace").strip()
                      if value:
                          return value
              return ""

          name = first(["bin/runtime/info/output_zip.txt", "bin/runtime/info/output_file.txt"])
          link = first(["bin/runtime/info/drive_link.txt", "bin/runtime/info/upload_link.txt"])
          output_path = first(["bin/runtime/info/output_path.txt"])
          artifact = Path(output_path) if output_path else Path("out") / name
          if not name or not artifact.is_file() or artifact.stat().st_size <= 0:
              raise SystemExit("DeadZone Port output archive is missing")
          parsed = urlsplit(link)
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("DeadZone Port delivery link is invalid")

          result = {
              "schema_version": "1.0",
              "request_id": os.environ["REQUEST_ID"],
              "project": "port",
              "status": "success",
              "provider": "google_drive",
              "url": link,
              "file_name": artifact.name,
              "size": artifact.stat().st_size,
              "completed_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("../deadzone-result.json").write_text(json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY

      - name: "📤 Expose Port result"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deadzone-result-${{ env.REQUEST_ID }}
          path: deadzone-result.json
          if-no-files-found: error
          retention-days: 1

      - name: "✅ Port completed"
        if: success() && steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" finalizing success 8 "DeadZone Port completed." || true

      - name: "❌ Port failed"
        if: failure() && steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" "${DZ_CURRENT_STAGE_KEY:-preparing}" failed "${DZ_COMPLETED_STAGES:-0}" "DeadZone Port stopped safely." || true

      - name: "🚫 Port cancelled"
        if: cancelled() && steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" "${DZ_CURRENT_STAGE_KEY:-preparing}" cancelled "${DZ_COMPLETED_STAGES:-0}" "DeadZone Port was cancelled safely." || true

      - name: "🧾 Upload Port diagnostics"
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deadzone-port-diagnostics-${{ env.REQUEST_ID }}
          path: |
            engine/build_action.log
            engine/bin/runtime/logs/
            engine/bin/runtime/reports/
          if-no-files-found: warn
          retention-days: 3

      - name: "🧹 Cleanup Port credentials"
        if: always()
        shell: bash
        run: rm -f -- engine/rclone.conf engine/bin/runtime/config/rclone.conf
