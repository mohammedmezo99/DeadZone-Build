name: "🧩 DeadZone FrameworkPatcher"

run-name: "FrameworkPatcher • ${{ inputs.request_id || github.actor }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Bot request ID. Leave empty for manual GitHub build."
        required: false
        type: string
      android_version:
        description: "Android version for manual build."
        required: false
        default: "16"
        type: choice
        options: ["13", "14", "15", "16"]
      device_name:
        description: "Device codename for manual build."
        required: false
        type: string
      rom_version:
        description: "ROM version for manual build."
        required: false
        type: string
      features:
        description: "Comma-separated features."
        required: false
        default: "disable_signature_verification"
        type: string
      framework_url:
        description: "HTTPS URL for framework.jar"
        required: false
        type: string
      services_url:
        description: "HTTPS URL for services.jar"
        required: false
        type: string
      miui_services_url:
        description: "HTTPS URL for miui-services.jar"
        required: false
        type: string
      miui_framework_url:
        description: "HTTPS URL for miui-framework.jar"
        required: false
        type: string
      builder_label:
        description: "Optional builder label for manual build."
        required: false
        type: string
      language:
        description: "Interface language for manual build."
        required: false
        default: "en"
        type: choice
        options: ["en", "ar"]
  workflow_call:
    inputs:
      request_id:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deadzone-frameworkpatcher-build-queue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CONTROL_BOT_CONTRACT_URL: https://deadzone-mezo-v3-20260726.fly.dev/contract/resolve
      CONTROL_BOT_TELEMETRY_URL: https://deadzone-mezo-v3-20260726.fly.dev/telemetry

    steps:
      - name: Checkout launcher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Load DeadZone secrets
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mohammedmezo99/DeadZone-Secrets
          token: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: main
          path: .deadzone-secrets
          fetch-depth: 1
          persist-credentials: false

      - name: Import project secrets
        id: central
        shell: bash
        env:
          DEADZONE_PRIVATE_TOKEN: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: bash .deadzone-secrets/load-build.sh frameworkpatcher

      - name: Resolve build mode
        id: mode
        shell: bash
        env:
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
          INPUT_ANDROID: ${{ inputs.android_version }}
          INPUT_DEVICE: ${{ inputs.device_name }}
          INPUT_ROM_VERSION: ${{ inputs.rom_version }}
          INPUT_FEATURES: ${{ inputs.features }}
          INPUT_FRAMEWORK_URL: ${{ inputs.framework_url }}
          INPUT_SERVICES_URL: ${{ inputs.services_url }}
          INPUT_MIUI_SERVICES_URL: ${{ inputs.miui_services_url }}
          INPUT_MIUI_FRAMEWORK_URL: ${{ inputs.miui_framework_url }}
          INPUT_BUILDER_LABEL: ${{ inputs.builder_label }}
          INPUT_LANGUAGE: ${{ inputs.language }}
        run: |
          set -Eeuo pipefail
          contract_path="$RUNNER_TEMP/deadzone-framework-contract.json"
          if [[ -n "${INPUT_REQUEST_ID:-}" ]]; then
            [[ "$INPUT_REQUEST_ID" =~ ^DZ-FP-[0-9]{8}-[0-9]{4}$ ]] || { echo "Invalid FrameworkPatcher request ID" >&2; exit 1; }
            [[ -n "${BUILD_PROGRESS_SECRET:-}" ]] || { echo "Missing BUILD_PROGRESS_SECRET" >&2; exit 1; }
            export REQUEST_ID="$INPUT_REQUEST_ID"
            export CONTRACT_PATH="$contract_path"
            python3 - <<'PY'
          import base64, hashlib, hmac, json, os, re, urllib.request
          from datetime import datetime, timezone
          secret = os.environ["BUILD_PROGRESS_SECRET"]
          request_id = os.environ["REQUEST_ID"]
          payload = {"schema_version":"1.0","request_id":request_id,"project":"frameworkpatcher","timestamp":datetime.now(timezone.utc).isoformat()}
          body = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          signature = hmac.new(secret.encode(), body, hashlib.sha256).hexdigest()
          request = urllib.request.Request(os.environ["CONTROL_BOT_CONTRACT_URL"], data=body, method="POST", headers={"Content-Type":"application/json","X-DeadZone-Signature":signature})
          with urllib.request.urlopen(request, timeout=20) as response:
              response_body = response.read()
              response_signature = response.headers.get("X-DeadZone-Signature", "")
          expected = hmac.new(secret.encode(), response_body, hashlib.sha256).hexdigest()
          if not hmac.compare_digest(expected, response_signature): raise SystemExit("Invalid control response signature")
          contract = json.loads(response_body)
          if contract.get("request_id") != request_id or contract.get("project") != "frameworkpatcher": raise SystemExit("Private contract mismatch")
          options = contract.get("options") or {}
          builder = contract.get("builder") or {}
          live = contract.get("live_message") or {}
          files = options.get("telegram_files") or {}
          language = "ar" if str(contract.get("language") or "").lower() == "ar" else "en"
          status_chat_id = int(live.get("chat_id") or 0)
          status_message_id = int(live.get("message_id") or 0)
          config = {
              "request_id": request_id,
              "android_version": str(options.get("android_version") or ""),
              "device_name": str(options.get("device_name") or ""),
              "rom_version": str(options.get("rom_version") or ""),
              "features": options.get("features") or [],
              "urls": {key: str(options.get(key) or "") for key in ("framework_url","services_url","miui_services_url","miui_framework_url")},
              "telegram_files": {key: str((files.get(key) or {}).get("file_id") or "") for key in ("framework_url","services_url","miui_services_url","miui_framework_url")},
              "builder_id": int(builder.get("telegram_user_id") or 0),
              "builder_slug": str(builder.get("slug") or ""),
              "builder_name": str(builder.get("display_name") or builder.get("username") or builder.get("slug") or "DeadZone Builder"),
              "language": language,
              "status_chat_id": status_chat_id,
              "status_message_id": status_message_id,
          }
          if config["builder_id"] <= 0 or not re.fullmatch(r"[a-z0-9_.-]{1,48}", config["builder_slug"]): raise SystemExit("Builder identity is invalid")
          if status_chat_id == 0 or status_message_id <= 0: raise SystemExit("Framework live-message contract is missing")
          open(os.environ["CONTRACT_PATH"], "w", encoding="utf-8").write(json.dumps(config, separators=(",", ":")))
          os.chmod(os.environ["CONTRACT_PATH"], 0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"REQUEST_ID={request_id}\nDEADZONE_CONTROLLED_BUILD=1\nDEADZONE_PROJECT=frameworkpatcher\n")
              out.write(f"DEADZONE_LANGUAGE={language}\nTELEGRAM_MSG_CHAT_ID={status_chat_id}\nTELEGRAM_MSG_ID={status_message_id}\n")
              out.write(f"BUILDER_ID={config['builder_id']}\nBUILDER_SLUG={config['builder_slug']}\n")
              out.write("BUILDER_NAME_B64=" + base64.b64encode(config["builder_name"].encode()).decode() + "\n")
          PY
            echo "mode=bot" >> "$GITHUB_OUTPUT"
          else
            export CONTRACT_PATH="$contract_path"
            python3 - <<'PY'
          import base64, json, os
          features = [x.strip() for x in os.environ.get("INPUT_FEATURES", "").split(",") if x.strip()]
          language = "ar" if os.environ.get("INPUT_LANGUAGE", "en").strip().lower() == "ar" else "en"
          builder = os.environ.get("INPUT_BUILDER_LABEL") or os.environ["GITHUB_ACTOR"]
          config = {
              "request_id": f"DZ-FP-DIRECT-{os.environ['GITHUB_RUN_ID']}",
              "android_version": os.environ.get("INPUT_ANDROID", "16"),
              "device_name": os.environ.get("INPUT_DEVICE", ""),
              "rom_version": os.environ.get("INPUT_ROM_VERSION", ""),
              "features": features,
              "urls": {
                  "framework_url": os.environ.get("INPUT_FRAMEWORK_URL", ""),
                  "services_url": os.environ.get("INPUT_SERVICES_URL", ""),
                  "miui_services_url": os.environ.get("INPUT_MIUI_SERVICES_URL", ""),
                  "miui_framework_url": os.environ.get("INPUT_MIUI_FRAMEWORK_URL", ""),
              },
              "telegram_files": {},
              "builder_id": 0,
              "builder_slug": "github",
              "builder_name": builder,
              "language": language,
          }
          open(os.environ["CONTRACT_PATH"], "w", encoding="utf-8").write(json.dumps(config, separators=(",", ":")))
          os.chmod(os.environ["CONTRACT_PATH"], 0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"REQUEST_ID={config['request_id']}\nDEADZONE_CONTROLLED_BUILD=0\nDEADZONE_PROJECT=frameworkpatcher\n")
              out.write(f"DEADZONE_LANGUAGE={language}\nBUILDER_ID=0\nBUILDER_SLUG=github\n")
              out.write("BUILDER_NAME_B64=" + base64.b64encode(builder.encode()).decode() + "\n")
          PY
            echo "mode=manual" >> "$GITHUB_OUTPUT"
          fi
          echo "FRAMEWORK_CONTRACT_PATH=$contract_path" >> "$GITHUB_ENV"
          echo "BUILD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Live — prepare Framework
        if: steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" preparing in_progress 0 "Preparing FrameworkPatcher request." || true

      - name: Validate build contract
        shell: bash
        run: |
          set -Eeuo pipefail
          for key in FRAMEWORK_ENGINE_REPOSITORY FRAMEWORK_MODULE_REPOSITORY PRIVATE_REPO_TOKEN RCLONE_CONFIG_BASE64 RCLONE_REMOTE_NAME; do
            [[ -n "${!key:-}" ]] || { echo "Missing required configuration: $key" >&2; exit 1; }
          done
          python3 - <<'PY'
          import json, os, re
          from urllib.parse import urlsplit
          path = os.environ["FRAMEWORK_CONTRACT_PATH"]
          config = json.load(open(path, encoding="utf-8"))
          android = str(config.get("android_version") or "")
          device = str(config.get("device_name") or "")
          version = str(config.get("rom_version") or "")
          features = config.get("features") or []
          urls = config.get("urls") or {}
          telegram_files = config.get("telegram_files") or {}
          allowed_features = {"disable_signature_verification","cn_notification_fix","disable_secure_flag","kaorios_toolbox","add_gboard"}
          if android not in {"13","14","15","16"}: raise SystemExit("Unsupported Android version")
          if not re.fullmatch(r"[A-Za-z0-9_.-]{1,48}", device): raise SystemExit("Invalid device codename")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9 ._()+-]{0,63}", version): raise SystemExit("Invalid ROM version")
          if not isinstance(features, list) or not features or len(features) != len(set(features)): raise SystemExit("Invalid feature selection")
          if any(x not in allowed_features for x in features): raise SystemExit("Unknown feature")
          if android in {"13","14"} and any(x in {"cn_notification_fix","disable_secure_flag"} for x in features): raise SystemExit("Selected feature is unavailable on this Android version")
          required = set()
          for feature in features:
              if feature == "disable_signature_verification": required |= {"framework_url","services_url","miui_services_url"}
              elif feature == "kaorios_toolbox": required.add("framework_url")
              elif feature == "cn_notification_fix": required.add("miui_services_url")
              elif feature == "disable_secure_flag": required |= {"services_url","miui_services_url"}
              elif feature == "add_gboard": required |= {"miui_services_url","miui_framework_url"}
          control_host = "deadzone-mezo-v3-20260726.fly.dev"
          allowed_hosts = {"drive.google.com","docs.google.com","github.com","raw.githubusercontent.com","objects.githubusercontent.com",control_host}
          for key in ("framework_url","services_url","miui_services_url","miui_framework_url"):
              url = str(urls.get(key) or "")
              file_id = str(telegram_files.get(key) or "")
              if url and file_id: raise SystemExit(f"{key} was provided twice")
              if url:
                  parsed = urlsplit(url)
                  host = (parsed.hostname or "").lower().rstrip(".")
                  if parsed.scheme != "https" or host not in allowed_hosts or parsed.username or parsed.password: raise SystemExit(f"Untrusted URL for {key}")
                  if host == control_host and not parsed.path.startswith("/framework-input/"): raise SystemExit(f"Invalid private input route for {key}")
                  print(f"::add-mask::{url}")
              if file_id and not re.fullmatch(r"[A-Za-z0-9_-]{10,256}", file_id): raise SystemExit(f"Invalid Telegram file reference for {key}")
              if key in required and not url and not file_id: raise SystemExit(f"Missing required input: {key}")
          config["api_level"] = {"13":"33","14":"34","15":"35","16":"36"}[android]
          open(path, "w", encoding="utf-8").write(json.dumps(config, separators=(",", ":")))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"ANDROID_VERSION={android}\nAPI_LEVEL={config['api_level']}\nDEVICE_NAME={device}\nROM_VERSION={version}\n")
              out.write(f"BUILDER_ID={int(config.get('builder_id') or 0)}\nBUILDER_SLUG={str(config.get('builder_slug') or 'github')}\n")
          PY

      - name: Live — load Framework engine
        if: steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" loading_engine in_progress 1 "Loading FrameworkPatcher engine and module template." || true

      - name: Load FrameworkPatcher engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ steps.central.outputs.engine_repository }}
          token: ${{ env.PRIVATE_REPO_TOKEN }}
          path: engine
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Load module template dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ steps.central.outputs.framework_module_repository }}
          token: ${{ env.PRIVATE_REPO_TOKEN }}
          path: module-template
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Live — prepare Framework tools
        if: steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" installing_tools in_progress 2 "Preparing Framework patch tools." || true

      - name: Prepare FrameworkPatcher environment
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf engine/templates/framework-patcher-module
          mkdir -p engine/templates
          mv module-template engine/templates/framework-patcher-module
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl file git openjdk-17-jre-headless p7zip-full wget zip unzip python3 python3-pip rclone
          python3 -m pip install --user "gdown==5.2.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          chmod +x engine/scripts/patcher_a13.sh engine/scripts/patcher_a14.sh engine/scripts/patcher_a15.sh engine/scripts/patcher_a16.sh
          test -s engine/Version
          test -s engine/templates/framework-patcher-module/module.prop

      - name: Live — apply Framework patches
        if: steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" building in_progress 3 "Loading JAR inputs and applying selected Framework patches." || true

      - name: Download required JAR inputs
        working-directory: engine
        shell: bash
        env:
          CONTRACT_PATH: ${{ env.FRAMEWORK_CONTRACT_PATH }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.parse, urllib.request, zipfile
          config = json.load(open(os.environ["CONTRACT_PATH"], encoding="utf-8"))
          names = {"framework_url":"framework.jar","services_url":"services.jar","miui_services_url":"miui-services.jar","miui_framework_url":"miui-framework.jar"}
          MAX_JAR_BYTES = 100 * 1024 * 1024
          def stream_download(request, target, limit=MAX_JAR_BYTES):
              with urllib.request.urlopen(request, timeout=180) as response, target.open("wb") as output:
                  total = 0
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk: break
                      total += len(chunk)
                      if total > limit: raise SystemExit("Input JAR exceeds download limit")
                      output.write(chunk)
          def telegram_download(file_id, target):
              token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
              if not token: raise SystemExit("Telegram input support is not configured")
              query = urllib.parse.urlencode({"file_id": file_id})
              metadata = urllib.request.Request(f"https://api.telegram.org/bot{token}/getFile?{query}", headers={"User-Agent":"DeadZone-System/1.0"})
              with urllib.request.urlopen(metadata, timeout=30) as response: result = json.load(response).get("result") or {}
              path = str(result.get("file_path") or "")
              size = int(result.get("file_size") or 0)
              if not path or ".." in path.split("/") or size > 20_000_000: raise SystemExit("Invalid Telegram file metadata")
              request = urllib.request.Request(f"https://api.telegram.org/file/bot{token}/{path}", headers={"User-Agent":"DeadZone-System/1.0"})
              stream_download(request, target, 20_000_000)
          active = []
          for key, filename in names.items():
              url = str((config.get("urls") or {}).get(key) or "")
              file_id = str((config.get("telegram_files") or {}).get(key) or "")
              if not url and not file_id: continue
              target = pathlib.Path(filename)
              if file_id: telegram_download(file_id, target)
              elif "drive.google.com" in url or "docs.google.com" in url: subprocess.run(["python3","-m","gdown","--fuzzy",url,"-O",str(target)], check=True)
              else: stream_download(urllib.request.Request(url, headers={"User-Agent":"DeadZone-System/1.0"}), target)
              size = target.stat().st_size
              if size < 128 or size > MAX_JAR_BYTES or not zipfile.is_zipfile(target): raise SystemExit(f"Invalid JAR: {filename}")
              active.append(key)
          if not active: raise SystemExit("No active JAR inputs")
          config["active_inputs"] = active
          open(os.environ["CONTRACT_PATH"], "w", encoding="utf-8").write(json.dumps(config, separators=(",", ":")))
          PY

      - name: Run FrameworkPatcher
        working-directory: engine
        shell: bash
        env:
          CONTRACT_PATH: ${{ env.FRAMEWORK_CONTRACT_PATH }}
          DEADZONE_STRICT_PATCHES: "1"
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          config = json.load(open(os.environ["CONTRACT_PATH"], encoding="utf-8"))
          jar_flags = {"framework_url":"--framework","services_url":"--services","miui_services_url":"--miui-services","miui_framework_url":"--miui-framework"}
          feature_flags = {"disable_signature_verification":"--disable-signature-verification","cn_notification_fix":"--cn-notification-fix","disable_secure_flag":"--disable-secure-flag","kaorios_toolbox":"--kaorios-toolbox","add_gboard":"--add-gboard"}
          args = ["bash","-e","-u","-o","pipefail",f"scripts/patcher_a{config['android_version']}.sh",config["api_level"],config["device_name"],config["rom_version"]]
          args.extend(jar_flags[key] for key in config["active_inputs"])
          args.extend(feature_flags[key] for key in config["features"])
          with open("deadzone-build.log", "w", encoding="utf-8") as log:
              process = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              for line in process.stdout or []:
                  sys.stdout.write(line); log.write(line)
              code = process.wait()
          if code: raise SystemExit(code)
          PY

      - name: Live — package Framework module
        if: steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" packaging in_progress 4 "Verifying patched JARs and assembling Framework module." || true

      - name: Verify and upload FrameworkPatcher module
        working-directory: engine
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import glob, hashlib, pathlib, re, zipfile
          outputs = glob.glob("Framework-Patcher-*.zip")
          if len(outputs) != 1: raise SystemExit("Expected exactly one FrameworkPatcher output")
          artifact = pathlib.Path(outputs[0])
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*\.zip", artifact.name) or artifact.stat().st_size <= 0: raise SystemExit("Unsafe or empty FrameworkPatcher output")
          if not zipfile.is_zipfile(artifact): raise SystemExit("FrameworkPatcher output is not a valid ZIP")
          pathlib.Path("artifact.env").write_text(f"ARTIFACT={artifact.name}\nSHA256={hashlib.sha256(artifact.read_bytes()).hexdigest()}\nSIZE={artifact.stat().st_size}\n", encoding="utf-8")
          PY
          source artifact.env
          if [[ "${DEADZONE_CONTROLLED_BUILD:-0}" == "1" ]]; then
            bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" preparing_upload in_progress 5 "Verifying Framework module before private delivery." || true
          fi
          config="$RUNNER_TEMP/deadzone-framework-rclone.conf"
          umask 077
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > "$config"
          chmod 600 "$config"
          base_dir="${RCLONE_UPLOAD_DIR:-module}"; base_dir="${base_dir#/}"; base_dir="${base_dir%/}"
          if [[ "${DEADZONE_CONTROLLED_BUILD:-0}" == "1" ]]; then
            remote="${RCLONE_REMOTE_NAME}:${base_dir}/frameworkpatcher/${BUILDER_SLUG}_${BUILDER_ID}/${REQUEST_ID}/Android${ANDROID_VERSION}/${DEVICE_NAME}/${ARTIFACT}"
            bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" uploading in_progress 6 "Uploading verified Framework module to DeadZone Cloud." || true
          else
            remote="${RCLONE_REMOTE_NAME}:${base_dir}/frameworkpatcher/direct/${GITHUB_ACTOR}/${GITHUB_RUN_ID}/Android${ANDROID_VERSION}/${DEVICE_NAME}/${ARTIFACT}"
          fi
          rclone --config "$config" copyto "$ARTIFACT" "$remote" --immutable --transfers 1
          link="$(rclone --config "$config" link "$remote")"
          [[ "$link" == https://* ]] || { echo "Invalid delivery link" >&2; exit 1; }
          echo "::add-mask::$link"
          {
            echo "FRAMEWORK_ARTIFACT=$ARTIFACT"
            echo "FRAMEWORK_SHA256=$SHA256"
            echo "FRAMEWORK_SIZE=$SIZE"
            echo "FRAMEWORK_LINK=$link"
          } >> "$GITHUB_ENV"

      - name: Live — finalize Framework result
        if: steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" finalizing in_progress 7 "Final Framework result verification." || true

      - name: Create result contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          result = {"schema_version":"1.0","request_id":os.environ["REQUEST_ID"],"project":"frameworkpatcher","status":"success","provider":"google_drive","url":os.environ["FRAMEWORK_LINK"],"file_name":os.environ["FRAMEWORK_ARTIFACT"],"sha256":os.environ["FRAMEWORK_SHA256"].lower(),"size":int(os.environ["FRAMEWORK_SIZE"]),"completed_at":datetime.now(timezone.utc).isoformat()}
          open("deadzone-result.json", "w", encoding="utf-8").write(json.dumps(result, sort_keys=True, indent=2))
          PY

      - name: Expose verified result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deadzone-result-${{ env.REQUEST_ID }}
          path: deadzone-result.json
          if-no-files-found: error
          retention-days: 1

      - name: Live — Framework verified
        if: success() && steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" finalizing success 8 "FrameworkPatcher completed." || true

      - name: Live — Framework failed
        if: failure() && steps.mode.outputs.mode == 'bot'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.deadzone-secrets/runtime/emit_stage.sh" "${DZ_CURRENT_STAGE_KEY:-preparing}" failed "${DZ_COMPLETED_STAGES:-0}" "FrameworkPatcher stopped safely." || true

      - name: Upload private diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frameworkpatcher-diagnostics-${{ env.REQUEST_ID }}
          path: engine/deadzone-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/deadzone-framework-rclone.conf" "$FRAMEWORK_CONTRACT_PATH"
