name: "DeadZone Legend"
run-name: "DeadZone Legend  ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "DeadZone Legend request ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  machine:
    uses: ./.github/workflows/machine-rom.yml
    with:
      project: legend
      project_code: LG
      edition_repository: mohammedmezo99/DeadZone_Legend
      edition_ref: main
      request_id: ${{ inputs.request_id }}
    secrets: inherit
