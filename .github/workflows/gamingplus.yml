name: "DeadZone GamingPlus"
run-name: "DeadZone GamingPlus  ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "DeadZone GamingPlus request ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  machine:
    uses: ./.github/workflows/machine-rom.yml
    with:
      project: gamingplus
      project_code: GP
      edition_repository: mohammedmezo99/DeadZone_GamingPlus
      edition_ref: main
      request_id: ${{ inputs.request_id }}
    secrets: inherit
