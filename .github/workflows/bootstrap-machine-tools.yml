name: Bootstrap Complete DeadZone Machine

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bootstrap-machine-tools.yml

permissions:
  contents: write

concurrency:
  group: deadzone-build-machine-bootstrap-v6
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MACHINE_TOKEN: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Record bootstrap run
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .github/bootstrap
          jq -n \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg commit "$GITHUB_SHA" \
            '{run_id:$run_id,run_attempt:$run_attempt,trigger_commit:$commit}' \
            > .github/bootstrap/run.json
          git config user.name deadzone-bootstrap-trace
          git config user.email actions@users.noreply.github.com
          git add .github/bootstrap/run.json
          git commit -m 'Record active Machine bootstrap run'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Checkout DeadZone Machine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mohammedmezo99/DeadZone-Machine
          token: ${{ env.MACHINE_TOKEN }}
          ref: main
          path: machine
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - name: Checkout pinned legacy tool source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mohammedmezo99/DeadZone_Lite_old
          token: ${{ env.MACHINE_TOKEN }}
          ref: 27e489cf077b8af2ab09cd45c68b8674e71471d6
          path: legacy
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Restore pinned SuperConfig database
        shell: bash
        env:
          LEGACY_ARTIFACT_ID: "8863484267"
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/deadzone-old-assets.zip"
          members="$RUNNER_TEMP/deadzone-old-members.txt"
          direct="$RUNNER_TEMP/superconfig-direct-members.txt"
          parts="$RUNNER_TEMP/superconfig-parts-info.txt"
          curl --fail --location --show-error \
            --retry 5 --retry-all-errors \
            -H "Authorization: Bearer $MACHINE_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/mohammedmezo99/DeadZone_Lite_old/actions/artifacts/${LEGACY_ARTIFACT_ID}/zip" \
            --output "$archive"
          unzip -Z1 "$archive" > "$members"
          grep -E '(^|/)SuperConfig/' "$members" > "$direct" || true
          grep -E '(^|/)parts_info$' "$members" > "$parts" || true

          rm -rf legacy/bin/device/SuperConfig
          mkdir -p legacy/bin/device/SuperConfig

          if [[ -s "$direct" ]]; then
            extracted="$RUNNER_TEMP/deadzone-old-superconfig"
            rm -rf "$extracted"
            mkdir -p "$extracted"
            while IFS= read -r member; do
              unzip -q -o "$archive" "$member" -d "$extracted"
            done < "$direct"
            super_root="$(find "$extracted" -type d -name SuperConfig -print -quit)"
            [[ -n "$super_root" ]] || { echo 'SuperConfig root was not reconstructed' >&2; exit 1; }
            cp -a "$super_root/." legacy/bin/device/SuperConfig/
          elif [[ -s "$parts" ]]; then
            while IFS= read -r part_member; do
              source_dir="${part_member%/parts_info}"
              codename="${source_dir##*/}"
              [[ "$codename" =~ ^[A-Za-z0-9_-]+$ ]] || {
                echo "Unsafe SuperConfig codename: $codename" >&2
                exit 1
              }
              destination="legacy/bin/device/SuperConfig/${codename,,}"
              mkdir -p "$destination"
              unzip -p "$archive" "$part_member" > "$destination/parts_info"
              super_member="$source_dir/super"
              if grep -Fxq "$super_member" "$members"; then
                unzip -p "$archive" "$super_member" > "$destination/super"
              fi
            done < "$parts"
          else
            echo 'No SuperConfig directory or parts_info files exist in the verified artifact.' >&2
            grep -Ei '(superconfig|parts_info|(^|/)super$)' "$members" | head -n 100 >&2 || true
            exit 1
          fi

          device_count="$(find legacy/bin/device/SuperConfig -mindepth 1 -maxdepth 1 -type d | wc -l)"
          file_count="$(find legacy/bin/device/SuperConfig -type f | wc -l)"
          ((device_count > 0 && file_count > 0)) || {
            echo 'Resolved SuperConfig database is empty' >&2
            exit 1
          }
          echo "Restored SuperConfig devices: $device_count; files: $file_count"
          rm -rf "$archive" "$members" "$direct" "$parts" "${extracted:-}"

      - name: Install standard Linux fallbacks
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$MACHINE_TOKEN" ]] || { echo 'Machine write token is missing' >&2; exit 1; }
          sudo apt-get update
          for package in brotli zstd zip rclone erofs-utils android-sdk-libsparse-utils android-sdk-liblp-utils android-sdk-ext4-utils; do
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$package" || true
          done

      - name: Assemble tools assets and Runtime
        shell: bash
        run: bash machine/scripts/bootstrap_internal_tools.sh "$GITHUB_WORKSPACE/legacy"

      - name: Commit complete Machine
        shell: bash
        run: |
          set -Eeuo pipefail
          cd machine
          rm -f .github/workflows/bootstrap-internal-tools.yml reports/bootstrap-internal-tools.log
          git config user.name deadzone-machine-bootstrap
          git config user.email actions@users.noreply.github.com
          git add -A tools assets runtime/template .github/workflows reports
          git commit -m 'Store complete toolchain and runtime assets inside Machine'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Remove temporary bootstrap workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf machine legacy .github/bootstrap
          git rm -f .github/workflows/bootstrap-machine-tools.yml
          git config user.name deadzone-build-cleanup
          git config user.email actions@users.noreply.github.com
          git add -A .github
          git commit -m 'Remove completed Machine bootstrap workflow'
          git pull --rebase origin main
          git push origin HEAD:main
