name: Bootstrap Complete DeadZone Machine

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bootstrap-machine-tools.yml

permissions:
  contents: write

concurrency:
  group: deadzone-build-machine-bootstrap-v11
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MACHINE_TOKEN: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Record bootstrap run
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .github/bootstrap
          jq -n \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg commit "$GITHUB_SHA" \
            '{run_id:$run_id,run_attempt:$run_attempt,trigger_commit:$commit}' \
            > .github/bootstrap/run.json
          git config user.name deadzone-bootstrap-trace
          git config user.email actions@users.noreply.github.com
          git add .github/bootstrap/run.json
          git commit -m 'Record active Machine bootstrap run'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Checkout DeadZone Machine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mohammedmezo99/DeadZone-Machine
          token: ${{ env.MACHINE_TOKEN }}
          ref: main
          path: machine
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - name: Checkout pinned legacy tool source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mohammedmezo99/DeadZone_Lite_old
          token: ${{ env.MACHINE_TOKEN }}
          ref: 27e489cf077b8af2ab09cd45c68b8674e71471d6
          path: legacy
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Install standard Linux fallbacks
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$MACHINE_TOKEN" ]] || { echo 'Machine write token is missing' >&2; exit 1; }
          sudo apt-get update
          for package in \
            brotli zstd zip rclone erofs-utils android-sdk-libsparse-utils \
            libc++-dev libc++abi-dev libunwind-dev; do
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$package" || true
          done

      - name: Assemble tools assets libraries and Runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("machine/scripts/bootstrap_internal_tools.sh")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "rm -rf tools/bin tools/python assets/flash-template runtime/template\n"
              "mkdir -p tools/bin tools/python assets/flash-template runtime/template\n",
              "rm -rf tools/bin tools/python tools/lib assets/flash-template runtime/template\n"
              "mkdir -p tools/bin tools/python tools/lib assets/flash-template runtime/template\n",
          )
          marker = "copy_python_bundle supermeta supermeta.py\n\nflash_source=\"\"\n"
          library_block = r'''copy_python_bundle supermeta supermeta.py

copy_library_as() {
    local source="$1"
    local name="$2"
    [[ -f "$source" || -L "$source" ]] || return 1
    cp -L -- "$source" "tools/lib/$name"
    chmod 0644 "tools/lib/$name"
}

find_library() {
    local name="$1"
    find \
        "$legacy/bin/tool" \
        /usr/lib /lib \
        -type f -name "$name" -print 2>/dev/null \
        | sort \
        | head -n1
}

while IFS= read -r source; do
    [[ -n "$source" ]] || continue
    copy_library_as "$source" "$(basename -- "$source")"
done < <(
    find "$legacy/bin/tool" -type f -name '*.so*' -print 2>/dev/null | sort
)

for pattern in 'libc++.so*' 'libc++abi.so*' 'libunwind.so*'; do
    while IFS= read -r source; do
        [[ -n "$source" ]] || continue
        copy_library_as "$source" "$(basename -- "$source")"
    done < <(find /usr/lib /lib -type f -name "$pattern" -print 2>/dev/null | sort -u)
done

for pass in 1 2 3 4; do
    copied=0
    unresolved=0
    while IFS= read -r binary; do
        file "$binary" | grep -q 'ELF' || continue
        ldd_output="$(LD_LIBRARY_PATH="$root/tools/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ldd "$binary" 2>&1 || true)"
        while IFS= read -r dependency; do
            [[ -n "$dependency" ]] || continue
            if [[ -f "tools/lib/$dependency" ]]; then
                continue
            fi
            source="$(find_library "$dependency")"
            if [[ -n "$source" ]]; then
                copy_library_as "$source" "$dependency"
                copied=1
                printf '[INFO] Bundled runtime library %s from %s\n' "$dependency" "$source"
            else
                printf '[ERROR] Runtime library cannot be resolved: %s requires %s\n' "$binary" "$dependency" >&2
                unresolved=1
            fi
        done < <(awk '/not found/{print $1}' <<<"$ldd_output" | sort -u)
    done < <(find tools/bin -maxdepth 1 -type f -print | sort)
    ((unresolved == 0)) && break
    ((copied == 1)) || exit 1
done

flash_source=""
'''
          if marker not in text:
              raise SystemExit("bootstrap library insertion marker is missing")
          text = text.replace(marker, library_block)
          text = text.replace(
              "python3 -m compileall -q tools/python\n"
              "while IFS= read -r binary; do\n"
              "    file \"$binary\" | grep -q 'ELF' || continue\n"
              "    missing=\"$(ldd \"$binary\" 2>/dev/null | awk '/not found/{print $1}' | paste -sd, -)\"\n"
              "    [[ -z \"$missing\" ]] || {\n"
              "        printf '[ERROR] Native tool has unresolved libraries: %s -> %s\\n' \"$binary\" \"$missing\" >&2\n"
              "        exit 1\n"
              "    }\n"
              "done < <(find tools/bin -maxdepth 1 -type f -print | sort)\n\n"
              "find tools/bin tools/python -type f -print0 | sort -z | xargs -0 sha256sum > tools/checksums.sha256\n",
              "while IFS= read -r python_file; do\n"
              "    PYTHONPYCACHEPREFIX=\"${TMPDIR:-/tmp}/deadzone-pyc\" python3 -m py_compile \"$python_file\"\n"
              "done < <(find tools/python -type f -name '*.py' -print | sort)\n"
              "while IFS= read -r binary; do\n"
              "    file \"$binary\" | grep -q 'ELF' || continue\n"
              "    ldd_output=\"$(LD_LIBRARY_PATH=\"$root/tools/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}\" ldd \"$binary\" 2>&1 || true)\"\n"
              "    missing=\"$(awk '/not found/{print $1}' <<<\"$ldd_output\" | paste -sd, -)\"\n"
              "    [[ -z \"$missing\" ]] || {\n"
              "        printf '[ERROR] Native tool has unresolved libraries: %s -> %s\\n' \"$binary\" \"$missing\" >&2\n"
              "        exit 1\n"
              "    }\n"
              "done < <(find tools/bin -maxdepth 1 -type f -print | sort)\n\n"
              "find tools/bin tools/python tools/lib -type f -print0 | sort -z | xargs -0 sha256sum > tools/checksums.sha256\n",
          )
          text = text.replace(
              '    "path_entries": ["tools/bin"],\n',
              '    "path_entries": ["tools/bin"],\n    "library_entries": ["tools/lib"],\n',
          )
          path.write_text(text, encoding="utf-8")
          PY
          bash machine/scripts/bootstrap_internal_tools.sh "$GITHUB_WORKSPACE/legacy"

      - name: Commit complete Machine
        shell: bash
        run: |
          set -Eeuo pipefail
          cd machine
          rm -f .github/workflows/bootstrap-internal-tools.yml reports/bootstrap-internal-tools.log
          git config user.name deadzone-machine-bootstrap
          git config user.email actions@users.noreply.github.com

          mapfile -t large_files < <(find tools assets -type f -size +90M -print | sort)
          if ((${#large_files[@]})); then
            git lfs install --local
            for path in "${large_files[@]}"; do
              git lfs track "$path"
            done
          fi

          git add -A tools assets runtime/template .github/workflows scripts/bootstrap_internal_tools.sh
          [[ -f .gitattributes ]] && git add .gitattributes
          git commit -m 'Store complete toolchain and runtime assets inside Machine'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Remove temporary bootstrap workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf machine legacy .github/bootstrap
          git rm -f .github/workflows/bootstrap-machine-tools.yml
          git config user.name deadzone-build-cleanup
          git config user.email actions@users.noreply.github.com
          git add -A .github
          git commit -m 'Remove completed Machine bootstrap workflow'
          git pull --rebase origin main
          git push origin HEAD:main
