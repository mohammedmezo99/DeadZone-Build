name: Bootstrap Complete DeadZone Machine

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bootstrap-machine-tools.yml

permissions:
  contents: write

concurrency:
  group: deadzone-build-machine-bootstrap-v14
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MACHINE_TOKEN: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Record bootstrap run
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .github/bootstrap
          jq -n \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg commit "$GITHUB_SHA" \
            '{run_id:$run_id,run_attempt:$run_attempt,trigger_commit:$commit}' \
            > .github/bootstrap/run.json
          git config user.name deadzone-bootstrap-trace
          git config user.email actions@users.noreply.github.com
          git add .github/bootstrap/run.json
          git commit -m 'Record active Machine bootstrap run'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Checkout DeadZone Machine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mohammedmezo99/DeadZone-Machine
          token: ${{ env.MACHINE_TOKEN }}
          ref: main
          path: machine
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - name: Checkout pinned legacy tool source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mohammedmezo99/DeadZone_Lite_old
          token: ${{ env.MACHINE_TOKEN }}
          ref: 27e489cf077b8af2ab09cd45c68b8674e71471d6
          path: legacy
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Install standard Linux fallbacks
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$MACHINE_TOKEN" ]] || { echo 'Machine read token is missing' >&2; exit 1; }
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            brotli zstd zip rclone erofs-utils android-sdk-libsparse-utils \
            libc++-18-dev libc++abi-18-dev libunwind-18-dev

      - name: Assemble tools assets libraries and Runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("machine/scripts/bootstrap_internal_tools.sh")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'find "$legacy/bin/tool" /usr/lib /lib \\\n        -type f -name "$name" -print 2>/dev/null',
              'find "$legacy/bin/tool" /usr/lib /lib \\\n        \\( -type f -o -type l \\) -name "$name" -print 2>/dev/null',
          )
          text = text.replace(
              'find "$legacy/bin/tool" -type f -name \'*.so*\' -print 2>/dev/null',
              'find "$legacy/bin/tool" \\( -type f -o -type l \\) -name \'*.so*\' -print 2>/dev/null',
          )
          text = text.replace(
              'find /usr/lib /lib -type f -name "$pattern" -print 2>/dev/null',
              'find /usr/lib /lib \\( -type f -o -type l \\) -name "$pattern" -print 2>/dev/null',
          )
          path.write_text(text, encoding="utf-8")
          PY
          bash machine/scripts/bootstrap_internal_tools.sh "$GITHUB_WORKSPACE/legacy"

      - name: Package completed Machine tree
        shell: bash
        run: |
          set -Eeuo pipefail
          tar --sort=name --mtime='UTC 2009-01-01' --owner=0 --group=0 --numeric-owner \
            -C machine -czf deadzone-machine-tree.tar.gz \
            tools assets runtime/template scripts/bootstrap_internal_tools.sh
          sha256sum deadzone-machine-tree.tar.gz > deadzone-machine-tree.tar.gz.sha256

      - name: Upload completed Machine tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deadzone-machine-tree-${{ github.run_id }}
          path: |
            deadzone-machine-tree.tar.gz
            deadzone-machine-tree.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Try direct Machine commit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd machine
          rm -f .github/workflows/bootstrap-internal-tools.yml reports/bootstrap-internal-tools.log
          git config user.name deadzone-machine-bootstrap
          git config user.email actions@users.noreply.github.com
          git add -A tools assets runtime/template .github/workflows scripts/bootstrap_internal_tools.sh
          git commit -m 'Store complete toolchain and runtime assets inside Machine'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Remove temporary bootstrap workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf machine legacy .github/bootstrap
          git rm -f .github/workflows/bootstrap-machine-tools.yml
          git config user.name deadzone-build-cleanup
          git config user.email actions@users.noreply.github.com
          git add -A .github
          git commit -m 'Remove completed Machine bootstrap workflow'
          git pull --rebase origin main
          git push origin HEAD:main
