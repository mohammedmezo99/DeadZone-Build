name: "DeadZone Ninja"
run-name: "DeadZone Ninja • ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "DeadZone Ninja request ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  machine:
    uses: ./.github/workflows/machine-rom.yml
    with:
      project: ninja
      project_code: NJ
      edition_repository: mohammedmezo99/DeadZone_Ninja
      edition_ref: main
      request_id: ${{ inputs.request_id }}
    secrets: inherit
