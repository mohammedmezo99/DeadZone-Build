name: "Certify Zircon OS3"
run-name: "Certify Zircon OS3  ${{ github.run_id }}"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/certify-zircon-os3.yml

permissions:
  contents: write

concurrency:
  group: certify-zircon-os3
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Record certification run
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .github/certification
          jq -n \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg commit "$GITHUB_SHA" \
            --arg rom "zircon-OS3.0.303.0.WNOCNXM" \
            '{run_id:$run_id,commit:$commit,rom:$rom,status:"started"}' \
            > .github/certification/zircon-run.json
          git config user.name deadzone-certification
          git config user.email actions@users.noreply.github.com
          git add .github/certification/zircon-run.json
          git commit -m 'Record active Zircon certification run'
          git push origin HEAD:main

  certify:
    needs: trace
    uses: ./.github/workflows/machine-rom.yml
    with:
      project: lite
      project_code: LT
      edition_repository: mohammedmezo99/DeadZone_Lite
      edition_ref: main
      rom_link: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.303.0.WNOCNXM/zircon-ota_full-OS3.0.303.0.WNOCNXM-user-16.0-09c35a83d6.zip
      builder_label: DeadZone Machine Certification
      language: ar
    secrets: inherit
