name: DeadZone Branch Cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_branch_cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | while IFS= read -r branch; do
            [[ "$branch" == "main" ]] && continue
            echo "Deleting branch: $branch"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done

      - name: Remove cleanup workflow from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Commit self-removal
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "DeadZone Automation"
          git config user.email "deadzone-automation@users.noreply.github.com"
          git rm .github/workflows/_branch_cleanup.yml
          git commit -m "cleanup: remove temporary branch cleanup workflow"
          git push origin HEAD:main
