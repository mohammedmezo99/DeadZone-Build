name: "Certify Zircon OS3 V2"
run-name: "Certify Zircon OS3 V2  ${{ github.run_id }}"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/certify-zircon-os3-v2.yml

permissions:
  contents: write

concurrency:
  group: certify-zircon-os3-v2
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Record certification run
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .github/certification
          jq -n \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg commit "$GITHUB_SHA" \
            --arg rom "zircon-OS3.0.303.0.WNOCNXM" \
            '{run_id:$run_id,commit:$commit,rom:$rom,status:"started",workflow:"v2"}' \
            > .github/certification/zircon-run-v2.json
          git config user.name deadzone-certification
          git config user.email actions@users.noreply.github.com
          git add .github/certification/zircon-run-v2.json
          git commit -m 'Record active Zircon V2 certification run'
          git pull --rebase origin main
          git push origin HEAD:main

  certify:
    needs: trace
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DEADZONE_PROJECT: lite
      DEADZONE_EDITION_REPOSITORY: mohammedmezo99/DeadZone_Lite
      DEADZONE_EDITION_REF: main
      ROM_URL: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.303.0.WNOCNXM/zircon-ota_full-OS3.0.303.0.WNOCNXM-user-16.0-09c35a83d6.zip

    steps:
      - name: Maximize build workspace
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-docker-images: "true"

      - name: Load DeadZone secrets
        uses: actions/checkout@v5
        with:
          repository: mohammedmezo99/DeadZone-Secrets
          token: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: main
          path: .deadzone-secrets
          fetch-depth: 1
          persist-credentials: false

      - name: Import Lite runtime
        shell: bash
        env:
          DEADZONE_PRIVATE_TOKEN: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: bash .deadzone-secrets/load-build.sh lite

      - name: Select Machine credential and clone
        shell: bash
        env:
          DEADZONE_SECRET_TOKEN: ${{ secrets.DEADZONE_PRIVATE_TOKEN }}
          PRIVATE_SECRET_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GH_SECRET_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -Eeuo pipefail
          selected=""
          selected_name=""
          for name in \
            DEADZONE_SECRET_TOKEN PRIVATE_SECRET_TOKEN GH_SECRET_TOKEN \
            PRIVATE_REPO_TOKEN GH_TOKEN GH_TOKEN_FALLBACK; do
            value="${!name:-}"
            [[ -n "$value" ]] || continue
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H "Authorization: Bearer $value" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/mohammedmezo99/DeadZone-Machine || true)"
            printf '[INFO] Machine access candidate %s: HTTP %s\n' "$name" "$status"
            if [[ "$status" == 200 ]]; then
              selected="$value"
              selected_name="$name"
              break
            fi
          done
          [[ -n "$selected" ]] || {
            echo '[ERROR] No configured credential can read DeadZone-Machine' >&2
            exit 1
          }
          printf '[INFO] Selected Machine credential: %s\n' "$selected_name"
          auth="$(printf 'x-access-token:%s' "$selected" | base64 -w0)"
          echo "::add-mask::$auth"
          rm -rf machine
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            clone --depth=1 --branch main \
            https://github.com/mohammedmezo99/DeadZone-Machine.git machine
          git -C machine lfs install --local
          git -C machine -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" lfs pull

      - name: Checkout Lite Edition
        uses: actions/checkout@v5
        with:
          repository: mohammedmezo99/DeadZone_Lite
          token: ${{ secrets.DEADZONE_PRIVATE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: main
          path: edition
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Prepare runner and verify Machine
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo timedatectl set-timezone Africa/Cairo
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl file git jq openjdk-17-jre-headless python3 tar unzip xz-utils
          make -C machine ci
          machine/bin/deadzone-machine doctor --json | tee machine-doctor.json
          bash -n edition/edition/run.sh
          jq -e '.schema_version == 1 and .machine_api == 1 and .id == "lite"' \
            edition/edition/manifest.json >/dev/null

      - name: Create certification request
        shell: bash
        run: |
          set -Eeuo pipefail
          request_id="DZ-LT-CERT-${GITHUB_RUN_ID}"
          echo "REQUEST_ID=$request_id" >> "$GITHUB_ENV"
          echo "::add-mask::$ROM_URL"
          jq -n \
            --arg request_id "$request_id" \
            --arg source "$ROM_URL" \
            --arg repository "$DEADZONE_EDITION_REPOSITORY" \
            --arg ref "$DEADZONE_EDITION_REF" \
            '{request_id:$request_id,rom:{source:$source},edition:{id:"lite",repository:$repository,ref:$ref},builder:{id:"0",name:"DeadZone Machine Certification"}}' \
            > request.json
          echo "DEADZONE_UPLOAD_ROOT=${RCLONE_UPLOAD_DIR%/}/certification/zircon/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Run DeadZone Machine on Zircon
        shell: bash
        env:
          DEADZONE_EDITION_SOURCE_DIR: ${{ github.workspace }}/edition
        run: |
          set -Eeuo pipefail
          sudo -E env \
            PATH="$PATH" HOME="$HOME" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            DEADZONE_EDITION_SOURCE_DIR="$DEADZONE_EDITION_SOURCE_DIR" \
            DEADZONE_CONTROLLED_BUILD="0" \
            DEADZONE_PROJECT="lite" \
            REQUEST_ID="$REQUEST_ID" \
            REQUEST_SOURCE="github-certification" \
            RCLONE_CONFIG_BASE64="$RCLONE_CONFIG_BASE64" \
            RCLONE_REMOTE_NAME="$RCLONE_REMOTE_NAME" \
            RCLONE_UPLOAD_DIR="$DEADZONE_UPLOAD_ROOT" \
            bash machine/machine.sh --request "$GITHUB_WORKSPACE/request.json" \
            2>&1 | tee deadzone-machine.log

      - name: Verify certification result
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime="machine/runtime/builds/${REQUEST_ID}"
          result="$runtime/reports/delivery/deadzone-result.json"
          release="$runtime/output/manifests/release.json"
          build="$runtime/reports/build-result.json"
          for file in "$result" "$release" "$build"; do
            [[ -s "$file" ]] || { echo "Missing certification file: $file" >&2; exit 1; }
          done
          jq -e --arg request_id "$REQUEST_ID" \
            '.schema_version == "1.0" and .status == "success" and .project == "lite" and .request_id == $request_id and .codename == "zircon"' \
            "$result" >/dev/null
          cp -- "$result" deadzone-result.json
          cp -- "$release" certification-release.json
          cp -- "$build" certification-build-result.json

      - name: Upload certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: zircon-os3-certification-${{ env.REQUEST_ID }}
          path: |
            deadzone-result.json
            certification-release.json
            certification-build-result.json
            machine-doctor.json
            deadzone-machine.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: zircon-os3-diagnostics-${{ env.REQUEST_ID || github.run_id }}
          path: |
            deadzone-machine.log
            machine-doctor.json
            request.json
            machine/runtime/builds/${{ env.REQUEST_ID }}/logs/
            machine/runtime/builds/${{ env.REQUEST_ID }}/reports/
            machine/runtime/builds/${{ env.REQUEST_ID }}/checkpoints/
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup temporary credentials
        if: always()
        shell: bash
        run: sudo rm -f -- "machine/runtime/builds/${REQUEST_ID:-unknown}/state/rclone.conf"
